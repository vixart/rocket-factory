env:
  app_env: "staging"
  service_name: "assembly-service"
  service_version: "1.0.0"

kafka:
  brokers: ["localhost:9092"]

logger:
  level: "info"

order_paid_consumer:
  topic_name: "order.paid"
  group: "assembly-service-order-paid-consumer"

ship_assembled_producer:
  topic_name: "assembly.ship-assembled"

otel:
  endpoint: "localhost:4317"
  enable_otlp: true
