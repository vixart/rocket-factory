openapi: 3.0.3
info:
  title: Order Service API
  version: 1.0.0
  description: |
    API for managing spaceship build orders.

    It allows creating orders, fetching their details,
    paying for them and cancelling them.

# servers is an optional section listing the base URLs of the API.
# Used:
# - when generating a client, as the default baseURL
# - in Swagger UI / Redoc, to switch environments
# - to document the available environments (dev, staging, prod)
servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Orders
    description: Order operations — create, fetch, pay and cancel

paths:
  /api/v1/orders:
    $ref: ./paths/orders.yaml
  /api/v1/orders/{order_uuid}:
    $ref: ./paths/order_by_uuid.yaml
  /api/v1/orders/{order_uuid}/pay:
    $ref: ./paths/order_pay.yaml
  /api/v1/orders/{order_uuid}/cancel:
    $ref: ./paths/order_cancel.yaml
