# A single error schema shared by every HTTP code.
#
# Instead of a separate file per HTTP error code
# (bad_request_error.yaml, not_found_error.yaml, internal_server_error.yaml and so on)
# we use one generic Error schema.
#
# Benefits:
# - reduces duplication: every error shares the same structure
# - simplifies maintenance: changes happen in one place
# - generates a single base Error type in the Go code

name: Error
type: object
required:
  - code
  - message
properties:
  code:
    type: integer
    description: HTTP error code
    example: 400
  message:
    type: string
    description: Human-readable error description
    example: "Invalid request parameters"
