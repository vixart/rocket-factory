post:
  summary: Pay for an order
  description: Pays for an order
  operationId: payOrder
  tags:
    - Orders
  parameters:
    - $ref: '../params/order_uuid.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/pay_order_request.yaml'
  responses:
    '200':
      description: Payment succeeded
      content:
        application/json:
          schema:
            $ref: '../components/pay_order_response.yaml'
    '400':
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '../components/errors/error.yaml'
    '404':
      description: Order not found
      content:
        application/json:
          schema:
            $ref: '../components/errors/error.yaml'
    '409':
      description: Order is already paid or cancelled
      content:
        application/json:
          schema:
            $ref: '../components/errors/error.yaml'
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '../components/errors/error.yaml'
