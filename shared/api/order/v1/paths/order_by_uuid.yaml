parameters:
  - $ref: ../params/order_uuid.yaml

get:
  summary: Get an order by UUID
  description: Returns the full information about a spaceship build order
  operationId: getOrder
  tags:
    - Orders
  responses:
    '200':
      description: Order found
      content:
        application/json:
          schema:
            $ref: ../components/order_dto.yaml
    '400':
      description: Invalid UUID format
      content:
        application/json:
          schema:
            $ref: ../components/errors/error.yaml
    '404':
      description: No order with the given UUID
      content:
        application/json:
          schema:
            $ref: ../components/errors/error.yaml
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ../components/errors/error.yaml
