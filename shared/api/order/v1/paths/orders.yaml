post:
  summary: Create an order
  description: Creates a new spaceship build order
  operationId: createOrder
  tags:
    - Orders
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/create_order_request.yaml'
  responses:
    '201':
      description: Order created
      content:
        application/json:
          schema:
            $ref: '../components/create_order_response.yaml'
    '400':
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '../components/errors/error.yaml'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../components/errors/error.yaml'
    '404':
      description: Part not found
      content:
        application/json:
          schema:
            $ref: '../components/errors/error.yaml'
    '409':
      description: Part is out of stock
      content:
        application/json:
          schema:
            $ref: '../components/errors/error.yaml'
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '../components/errors/error.yaml'
