post:
  summary: Cancel an order
  description: Cancels an order that has not been paid yet
  operationId: cancelOrder
  tags:
    - Orders
  parameters:
    - $ref: '../params/order_uuid.yaml'
  responses:
    '200':
      description: Order cancelled
      content:
        application/json:
          schema:
            $ref: '../components/cancel_order_response.yaml'
    '400':
      description: Invalid UUID
      content:
        application/json:
          schema:
            $ref: '../components/errors/error.yaml'
    '404':
      description: Order not found
      content:
        application/json:
          schema:
            $ref: '../components/errors/error.yaml'
    '409':
      description: Order is already paid
      content:
        application/json:
          schema:
            $ref: '../components/errors/error.yaml'
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '../components/errors/error.yaml'
