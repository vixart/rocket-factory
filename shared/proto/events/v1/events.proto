syntax = "proto3";

package events.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/vixart/rocket-factory/shared/pkg/proto/events/v1;eventsv1";

// OrderPaid is emitted when an order is paid
// Producer: OrderService
// Consumer: AssemblyService
message OrderPaid {
  // Unique event identifier, used for idempotency
  string event_uuid = 1;

  // Identifier of the paid order
  string order_uuid = 2;

  // User identifier
  string user_uuid = 3;
}

// ShipAssembled is emitted when a ship has been assembled
// Producer: AssemblyService
// Consumer: OrderService
message ShipAssembled {
  // Unique event identifier
  string event_uuid = 1;

  // Order identifier
  string order_uuid = 2;

  // User identifier
  string user_uuid = 3;

  // Build time in seconds
  int64 build_time_sec = 4;

  // When the assembly finished
  google.protobuf.Timestamp assembled_at = 5;
}
