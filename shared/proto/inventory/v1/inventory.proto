syntax = "proto3";

package inventory.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/vixart/rocket-factory/shared/pkg/proto/inventory/v1;inventoryv1";

// InventoryService manages the catalogue of spaceship parts
service InventoryService {
  // GetPart returns a part by UUID
  rpc GetPart(GetPartRequest) returns (GetPartResponse);

  // ListParts returns a list of parts with optional filtering
  rpc ListParts(ListPartsRequest) returns (ListPartsResponse);

  // ValidateCompatibility checks that the parts are compatible with each other
  rpc ValidateCompatibility(ValidateCompatibilityRequest) returns (ValidateCompatibilityResponse);

  // ReserveParts reserves parts for an order
  rpc ReserveParts(ReservePartsRequest) returns (ReservePartsResponse);

  // ReleaseParts releases previously reserved parts
  rpc ReleaseParts(ReleasePartsRequest) returns (ReleasePartsResponse);

  // CommitParts writes parts off the stock after a ship has been assembled.
  // OrderService calls it after receiving the ShipAssembled event from Kafka:
  // stock -= 1, reserved -= 1 for every part
  rpc CommitParts(CommitPartsRequest) returns (CommitPartsResponse);
}

// Part type
enum PartType {
  // Unspecified
  PART_TYPE_UNSPECIFIED = 0;
  // Hull
  PART_TYPE_HULL = 1;
  // Engine
  PART_TYPE_ENGINE = 2;
  // Shield
  PART_TYPE_SHIELD = 3;
  // Weapon
  PART_TYPE_WEAPON = 4;
}

// Part is a spaceship part
message Part {
  // Unique part identifier
  string uuid = 1;

  // Part name
  string name = 2;

  // Part description
  string description = 3;

  // Price in kopecks (5000 RUB = 500000)
  int64 price = 4;

  // Part type
  PartType part_type = 5;

  // Quantity in stock
  int64 stock_quantity = 6;

  // Creation date
  google.protobuf.Timestamp created_at = 7;
}

// Request to fetch a part by UUID
message GetPartRequest {
  // Part UUID
  string uuid = 1;
}

// Response carrying the part
message GetPartResponse {
  // The part that was found
  Part part = 1;
}

// Request to list parts
message ListPartsRequest {
  // Filter by part type
  PartType part_type = 1;

  // Filter by UUID
  repeated string uuids = 2;
}

// Response carrying the list of parts
message ListPartsResponse {
  // The parts
  repeated Part parts = 1;
}

// Request to validate part compatibility across the ship slots
message ValidateCompatibilityRequest {
  // UUID of the part in the hull slot (required slot)
  string hull_uuid = 1;

  // UUID of the part in the engine slot (required slot)
  string engine_uuid = 2;

  // UUID of the part in the shield slot (optional; an empty string means the slot is unused)
  string shield_uuid = 3;

  // UUID of the part in the weapon slot (optional; an empty string means the slot is unused)
  string weapon_uuid = 4;
}

// Compatibility response (empty means the parts are compatible)
message ValidateCompatibilityResponse {}

// Request to reserve parts
message ReservePartsRequest {
  // UUIDs of the parts to reserve
  repeated string uuids = 1;
}

// Reservation response (empty means success)
message ReservePartsResponse {}

// Request to release previously reserved parts
message ReleasePartsRequest {
  // UUIDs of the parts to release
  repeated string uuids = 1;
}

// Release response (empty means success)
message ReleasePartsResponse {}

// Request to write parts off the stock
message CommitPartsRequest {
  // UUIDs of the parts to write off
  repeated string uuids = 1;
}

// Write-off response (empty means success)
message CommitPartsResponse {}
