# Configuration file for ogen (the OpenAPI-to-Go code generator).
# Ogen looks for this file in the current directory on startup.
#
# Documentation: https://ogen.dev/docs/configuration

parser:
  # allow_remote lets the parser fetch external files over URLs.
  # It is needed when the OpenAPI spec uses $ref links to remote resources,
  # for example:
  #   $ref: 'https://example.com/schemas/common.yaml#/components/schemas/Error'
  # Default: false, for security reasons.
  allow_remote: true

generator:
  # convenient_errors disables the "convenient" errors generated as GenericErrorStatusCode.
  # When the OpenAPI spec has a "default" response, ogen generates a GenericErrorStatusCode
  # type that can return errors with an arbitrary HTTP code.
  # We do not use a "default" response (the spec lists 400, 404, 500 explicitly), so the
  # feature is disabled to silence the INFO message during generation.
  convenient_errors: false
