# mockery v3 configuration.
# Documentation: https://vektra.github.io/mockery/latest/configuration/

# The testify template with the expecter API.
template: testify

# Formatting of the generated code.
formatter: goimports

# Where the generated mocks go (next to the interface, in a mocks subdirectory).
dir: "{{.InterfaceDir}}/mocks"

# Mock file name (snake_case via the snakecase function).
filename: "mock_{{ .InterfaceName | snakecase }}.go"

# Mock package name.
pkgname: "mocks"

# Mock struct name (matches the interface name).
structname: "{{.InterfaceName}}"

# Overwrite existing files.
force-file-write: true

# Boilerplate text (licence, header).
template-data:
  boilerplate-file: ".mockery_boilerplate_text.txt"

packages:
  # IAM service
  github.com/vixart/rocket-factory/iam/internal/api/auth/v1:
    config:
      include-interface-regex: ".*Service"
  github.com/vixart/rocket-factory/iam/internal/api/user/v1:
    config:
      include-interface-regex: ".*Service"
  github.com/vixart/rocket-factory/iam/internal/service/iam:
    config:
      include-interface-regex: ".*Repository"

  # Assembly service
  github.com/vixart/rocket-factory/assembly/internal/service/assembly:
    config:
      include-interface-regex: ".*Producer"
  github.com/vixart/rocket-factory/assembly/internal/consumer/order_paid:
    config:
      include-interface-regex: ".*(Consumer|Service)"
  github.com/vixart/rocket-factory/assembly/internal/producer/ship_assembled:
    config:
      include-interface-regex: ".*Producer"

  # Order service
  github.com/vixart/rocket-factory/order/internal/api/order/v1:
    config:
      include-interface-regex: ".*Service"
  github.com/vixart/rocket-factory/order/internal/service/order:
    config:
      include-interface-regex: ".*(Repository|Client|TxManager|Producer)"

  # Inventory service
  github.com/vixart/rocket-factory/inventory/internal/api/inventory/v1:
    config:
      include-interface-regex: ".*Service"
  github.com/vixart/rocket-factory/inventory/internal/service/application/part:
    config:
      include-interface-regex: ".*(Repository|Checker|TxManager)"

  # Payment service
  github.com/vixart/rocket-factory/payment/internal/api/payment/v1:
    config:
      include-interface-regex: ".*Service"
