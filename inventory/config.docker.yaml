env:
  app_env: "docker"
  service_name: "inventory-service"
  service_version: "1.0.0"

grpc:
  host: "0.0.0.0"
  port: "50051"

logger:
  level: "info"

pg:
  host: "postgres-inventory"
  port: "5432"
  database: "inventory-service"
  user: "inventory-service-user"
  password: "inventory-service-password"
  sslmode: "disable"
  # pgx pool. The pgx default is max(4, NumCPU); on that Reserve is limited not by the
  # database but by connection starvation: a transaction holds its connection while
  # waiting for a row lock. postgres-inventory runs with the standard max_connections=100,
  # so 25 for the single service instance leaves plenty of headroom.
  max_conns: 25

client:
  iam_address: "iam-service:50053"

otel:
  endpoint: "otel-collector:4317"
  enable_otlp: true
  sampling_ratio: 1.0
