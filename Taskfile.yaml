version: '3'

# Подключаем core.env как источник версий для сборки контейнеров.
# Переменные GO_IMAGE / ALPINE_IMAGE / GOOSE_VERSION оттуда автоматически
# доступны как {{.GO_IMAGE}} и т.д. в задачах ниже.
dotenv: ['core.env']

vars:
  GO_VERSION: '1.26.0'
  GOLANGCI_LINT_VERSION: 'v2.12.2'
  GCI_VERSION: 'v0.14.0'
  GOFUMPT_VERSION: 'v0.10.0'
  BUF_VERSION: '1.69.0'
  PROTOC_GEN_GO_VERSION: 'v1.36.11'
  PROTOC_GEN_GO_GRPC_VERSION: 'v1.6.1'
  OGEN_VERSION: 'v1.20.3'

  BIN_DIR: '{{.ROOT_DIR}}/bin'
  GOLANGCI_LINT: '{{.BIN_DIR}}/golangci-lint'
  GCI: '{{.BIN_DIR}}/gci'
  GOFUMPT: '{{.BIN_DIR}}/gofumpt'
  BUF: '{{.BIN_DIR}}/buf'
  PROTOC_GEN_GO: '{{.BIN_DIR}}/protoc-gen-go'
  PROTOC_GEN_GO_GRPC: '{{.BIN_DIR}}/protoc-gen-go-grpc'
  OGEN: '{{.BIN_DIR}}/ogen'

  MOCKERY_VERSION: 'v3.7.0'
  MOCKERY: '{{.BIN_DIR}}/mockery'

  # GOOSE_VERSION приходит из core.env через dotenv — один источник истины
  # для версии goose: и хост-инсталл здесь, и docker-сборка migrator.Dockerfile
  GOOSE: '{{.BIN_DIR}}/goose'

  COVERAGE_DIR: '{{.ROOT_DIR}}/coverage'
  COVERAGE_FILE: '{{.COVERAGE_DIR}}/coverage.out'
  COVERAGE_THRESHOLD: '40'

  KIBANA_URL: 'http://localhost:5601'
  ELASTICSEARCH_URL: 'http://localhost:9200'
  JAEGER_URL: 'http://localhost:16686'

  VEGETA_VERSION: 'v12.13.0'
  VEGETA: '{{.BIN_DIR}}/vegeta'

  # Сколько пар корпус+двигатель завести под нагрузочный тест. Используется
  # и в load:seed (что создать), и в load:http (по чему чередовать запросы) —
  # значения должны совпадать, поэтому живут в одном месте.
  LOAD_PAIRS: 10

  MODULES: iam assembly order inventory payment

  # Префикс модулей репозитория — по нему gci выделяет «свои» импорты в отдельную группу.
  MODULE_PREFIX: 'github.com/vixart/rocket-factory'

tasks:
  formatters:install:
    desc: "Устанавливает gofumpt и gci"
    cmds:
      - echo '📦 Устанавливаем gofumpt...'
      - GOBIN={{.BIN_DIR}} go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}
      - echo '📦 Устанавливаем gci...'
      - GOBIN={{.BIN_DIR}} go install github.com/daixiang0/gci@{{.GCI_VERSION}}
    status:
      - test -x {{.GOFUMPT}}
      - test -x {{.GCI}}

  golangci-lint:install:
    desc: "Устанавливает golangci-lint"
    cmds:
      - echo '📦 Устанавливаем golangci-lint...'
      - GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
    status:
      - test -x {{.GOLANGCI_LINT}}

  buf:install:
    desc: "Устанавливает buf"
    cmds:
      - echo '📦 Устанавливаем buf...'
      - GOBIN={{.BIN_DIR}} go install github.com/bufbuild/buf/cmd/buf@v{{.BUF_VERSION}}
    status:
      - test -x {{.BUF}}

  proto:install-plugins:
    desc: "Устанавливает protoc-плагины"
    cmds:
      - echo '📦 Устанавливаем protoc-gen-go...'
      - GOBIN={{.BIN_DIR}} go install google.golang.org/protobuf/cmd/protoc-gen-go@{{.PROTOC_GEN_GO_VERSION}}
      - echo '📦 Устанавливаем protoc-gen-go-grpc...'
      - GOBIN={{.BIN_DIR}} go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@{{.PROTOC_GEN_GO_GRPC_VERSION}}
    status:
      - test -x {{.PROTOC_GEN_GO}}
      - test -x {{.PROTOC_GEN_GO_GRPC}}

  ogen:install:
    desc: "Устанавливает ogen"
    cmds:
      - echo '📦 Устанавливаем ogen...'
      - GOBIN={{.BIN_DIR}} go install github.com/ogen-go/ogen/cmd/ogen@{{.OGEN_VERSION}}
    status:
      - test -x {{.OGEN}}

  setup:
    desc: "Устанавливает все инструменты"
    deps: [formatters:install, golangci-lint:install, buf:install, proto:install-plugins, ogen:install]

  run:order:
    desc: "Запускает OrderService (HTTP сервер на :8080)"
    dir: order
    cmds:
      - go run ./cmd

  run:inventory:
    desc: "Запускает InventoryService (gRPC сервер на :50051)"
    dir: inventory
    cmds:
      - go run ./cmd

  run:payment:
    desc: "Запускает PaymentService (gRPC сервер на :50052)"
    dir: payment
    cmds:
      - go run ./cmd

  run:iam:
    desc: "Запускает IAMService (gRPC сервер аутентификации на :50053)"
    dir: iam
    cmds:
      - go run ./cmd

  run:assembly:
    desc: "Запускает AssemblyService (Kafka consumer/producer)"
    dir: assembly
    cmds:
      - go run ./cmd

  format:
    desc: "Форматирует код (gofumpt + gci)"
    deps: [formatters:install]
    cmds:
      - echo '🧹 Форматируем код через gofumpt...'
      - find . -type f -name '*.go' ! -path '*/mocks/*' ! -path '*/pkg/proto/*' ! -path '*/pkg/openapi/*' -exec {{.GOFUMPT}} -extra -w {} +
      - echo '📦 Сортируем импорты через gci...'
      - find . -type f -name '*.go' ! -path '*/mocks/*' ! -path '*/pkg/proto/*' ! -path '*/pkg/openapi/*' -exec {{.GCI}} write -s standard -s default -s "prefix({{.MODULE_PREFIX}})" {} +

  hooks:install:
    desc: "Устанавливает git-хуки из scripts/ в .git/hooks (с битом исполнения)"
    cmds:
      - echo '🪝 Устанавливаем pre-commit hook...'
      # Без cp хук остаётся невыполняемым файлом, а git молча пропускает такие хуки.
      - cp scripts/pre-commit .git/hooks/pre-commit
      - chmod +x .git/hooks/pre-commit
      - echo '✅ Хук установлен — .git/hooks/pre-commit'

  build:
    desc: "Собирает все Go-модули (go build)"
    cmds:
      - go build ./iam/... ./assembly/... ./order/... ./inventory/... ./payment/... ./platform/...

  lint:
    desc: "Запускает golangci-lint"
    deps: [golangci-lint:install]
    cmds:
      - '{{.GOLANGCI_LINT}} run --allow-parallel-runners ./iam/... ./assembly/... order/... inventory/... payment/... platform/... --config=.golangci.yml'

  proto:format:
    desc: "Форматирует .proto-файлы (buf format)"
    deps: [buf:install]
    dir: shared/proto
    cmds:
      - echo '🧹 Форматируем .proto-файлы...'
      - '{{.BUF}} format -w'

  proto:lint:
    desc: "Проверяет .proto-файлы линтером"
    deps: [buf:install, proto:install-plugins, proto:format]
    dir: shared/proto
    cmds:
      - echo '🔍 Проверяем .proto-файлы...'
      - '{{.BUF}} lint'

  proto:gen:
    desc: "Генерирует Go-код из .proto"
    deps: [buf:install, proto:install-plugins, proto:format]
    dir: shared/proto
    cmds:
      - echo '🔨 Генерируем Go-код из .proto...'
      - '{{.BUF}} generate'

  ogen:gen:
    desc: "Генерирует Go-код из OpenAPI"
    deps: [ogen:install]
    dir: shared
    cmds:
      - echo '🔨 Генерируем Go-код из OpenAPI...'
      - '{{.OGEN}} -target ./pkg/openapi/order/v1 -package orderv1 -clean ./api/order/v1/order.openapi.yaml 2>/dev/null'

  gen:
    desc: "Генерирует весь код"
    cmds:
      - task: proto:gen
      - task: ogen:gen

  deps:update:
    desc: "Обновляет зависимости"
    cmds:
      - echo '🔄 Синхронизируем go.work...'
      - go work sync
      - echo '🔄 Обновляем зависимости в сервисах...'
      - for: { var: MODULES }
        cmd: cd {{.ITEM}} && go mod tidy -compat={{.GO_VERSION}}
      - echo '🔄 Обновляем зависимости в platform...'
      - cd platform && go mod tidy -compat={{.GO_VERSION}}
      - echo '🔄 Обновляем зависимости в shared (proto/openapi)...'
      - cd shared && go mod tidy -compat={{.GO_VERSION}}

  mockery:install:
    desc: "Устанавливает mockery"
    cmds:
      - echo '📦 Устанавливаем mockery...'
      - GOBIN={{.BIN_DIR}} go install github.com/vektra/mockery/v3@{{.MOCKERY_VERSION}}
    status:
      - test -x {{.MOCKERY}}

  mocks:gen:
    desc: "Генерирует моки интерфейсов"
    deps: [mockery:install]
    cmds:
      - echo '🧪 Генерация моков...'
      - '{{.MOCKERY}}'

  test:
    desc: "Запускает unit-тесты с race-детектором"
    cmds:
      - for: [ 'assembly', 'iam', 'inventory', 'order', 'payment' ]
        cmd: |
          echo "=== {{.ITEM}} ==="
          cd {{.ITEM}} && go test -v -race -count=1 ./...

  coverage:clean:
    desc: "Очищает директорию с отчётами покрытия"
    internal: true
    cmds:
      - rm -rf {{.COVERAGE_DIR}}
      - mkdir -p {{.COVERAGE_DIR}}

  test:coverage:
    desc: "Тесты с покрытием бизнес-логики"
    deps: [coverage:clean]
    vars:
      TARGET_PACKAGES:
        sh: |
          for mod in order inventory payment; do
            (cd "$mod" && go list ./... | grep -v "/mocks" | grep -E '/(api|service)/')
          done | tr '\n' ','
    preconditions:
      - sh: test -n "{{.TARGET_PACKAGES}}"
        msg: "Не найдено пакетов для тестирования"
    cmds:
      - echo "📦 Целевые пакеты:{{.TARGET_PACKAGES}}"
      - for: ['iam', 'assembly', 'order', 'inventory', 'payment']
        cmd: |
          echo "=== {{.ITEM}} ==="
          cd {{.ITEM}} && go test -v -race -covermode=atomic -coverprofile={{.COVERAGE_DIR}}/{{.ITEM}}.out -coverpkg={{.TARGET_PACKAGES}} ./...
      - echo "📊 Объединяем отчёты покрытия..."
      - head -1 {{.COVERAGE_DIR}}/order.out > {{.COVERAGE_FILE}}
      - for: ['iam', 'assembly', 'order', 'inventory', 'payment']
        cmd: tail -n +2 {{.COVERAGE_DIR}}/{{.ITEM}}.out >> {{.COVERAGE_FILE}}
      - echo "📊 Покрытие по функциям:"
      - go tool cover -func={{.COVERAGE_FILE}}
      - task: coverage:threshold

  coverage:threshold:
    desc: "Проверяет соответствие покрытия порогу"
    internal: true
    vars:
      COVERAGE:
        sh: go tool cover -func={{.COVERAGE_FILE}} | tail -n1 | awk '{print $NF}' | tr -d '%'
    preconditions:
      - sh: test -f {{.COVERAGE_FILE}}
        msg: "Файл покрытия не найден. Запустите task test:coverage"
    cmds:
      - echo "🧾 Общее покрытие:{{.COVERAGE}}% | Порог:{{.COVERAGE_THRESHOLD}}%"
      - cmd: test $(echo "{{.COVERAGE}} >= {{.COVERAGE_THRESHOLD}}" | bc) -eq 1
      - echo "✅ Покрытие соответствует порогу"

  coverage:badge:
    desc: "Формирует coverage/badge.json для shields.io endpoint-бейджа в README"
    vars:
      COVERAGE:
        sh: go tool cover -func={{.COVERAGE_FILE}} | tail -n1 | awk '{print $NF}' | tr -d '%'
    preconditions:
      - sh: test -f {{.COVERAGE_FILE}}
        msg: "Файл покрытия не найден. Запустите task test:coverage"
    cmds:
      # Формат строго задан shields.io (endpoint badge): без schemaVersion/label/message
      # бейдж рендерится как "invalid response data".
      - |
        pct='{{.COVERAGE}}'
        color=$(awk -v p="$pct" -v t={{.COVERAGE_THRESHOLD}} 'BEGIN{
          print p>=90 ? "brightgreen" : p>=75 ? "green" : p>=60 ? "yellowgreen" : p>=t ? "yellow" : "red"
        }')
        printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
          "$pct" "$color" > {{.COVERAGE_DIR}}/badge.json
        echo "🏷  $(cat {{.COVERAGE_DIR}}/badge.json)"

  coverage:html:
    desc: "Генерирует HTML-отчёт покрытия"
    deps: [test:coverage]
    vars:
      HTML_FILE: '{{.COVERAGE_DIR}}/coverage.html'
    cmds:
      - go tool cover -html={{.COVERAGE_FILE}} -o {{.HTML_FILE}}
      - echo "🌐 Отчёт сохранён в {{.HTML_FILE}}"
      - cmd: open {{.HTML_FILE}}
        platforms: [darwin]

  coverage:check:
    desc: "Проверяет покрытие без запуска тестов"
    cmds:
      - task: coverage:threshold

  goose:install:
    desc: "Устанавливает goose (миграции БД)"
    cmds:
      - echo '📦 Устанавливаем goose...'
      - GOBIN={{.BIN_DIR}} go install github.com/pressly/goose/v3/cmd/goose@{{.GOOSE_VERSION}}
    status:
      - test -x {{.GOOSE}}

  net:create:
    silent: true # не эхоим сам скрипт: в параллельном выводе он превращается в кашу
    desc: "Создаёт общую docker-сеть microservices-net (идемпотентно)"
    cmds:
      # Только create: раньше здесь был ещё `network rm`, но он несовместим
      # с параллельным подъёмом стеков (up-infra:parallel) — удаление сети
      # из-под уже стартующих контейнеров ломает их подключение. Сеть удаляет
      # down-core, этого достаточно.
      - docker network create microservices-net 2>/dev/null || true

  up-core:
    desc: "Создать общую сеть и поднять core контейнеры (Kafka + Observability)"
    cmds:
      - echo '[task] 🌐 Создаём общую сеть microservices-net'
      - task: net:create
      - echo '[task] 🚀 Поднимаем core контейнеры (Kafka + Redis для rate limiter)'
      # --progress plain: up-core идёт параллельно с подъёмом БД, а tty-прогресс
      # compose перехватывает терминал и ломает вывод соседних задач.
      - docker compose --progress plain -f deploy/compose/core/docker-compose.yml --env-file core.env up --build --detach
      - echo '[task] 📊 Поднимаем observability (OTEL Collector, ES, Kibana, Prometheus, Grafana, Jaeger)'
      # По контейнеру за раз и с --no-deps — намеренно. Обычный `up --detach`
      # не возвращает управление, пока не выполнятся depends_on: condition:
      # service_healthy, то есть держит запуск Kibana до готовности Elasticsearch,
      # и это ~55 секунд ожидания в foreground. Kibana и коллектор умеют
      # переподключаться сами, поэтому дешевле запустить всё сразу, а готовности
      # дождаться ниже (es:init) и в самом конце up-* (kibana:init) — к тому
      # моменту Kibana уже прогрелась параллельно с остальной инфраструктурой.
      - |
        for svc in elasticsearch kibana jaeger prometheus grafana otel-collector; do
          docker compose --progress plain -f deploy/compose/observability/docker-compose.yml --env-file core.env \
            up --build --detach --no-deps "$svc"
        done
      # Создаём топики до старта сервисов: KAFKA_AUTO_CREATE_TOPICS_ENABLE не спасает,
      # потому что консьюмер обращается к топику раньше, чем брокер успевает его завести,
      # получает UNKNOWN_TOPIC_OR_PARTITION и роняет весь сервис (см. kafka:create-topics).
      # Стоит после запуска observability, чтобы ES и Kibana грелись, пока ждём брокер.
      - task: kafka:init
      # Без index template otel-logs экспортер коллектора получает
      # index_not_found_exception и логи теряются, поэтому ES дожидаемся здесь.
      # Data View в Kibana заводится последним шагом up-infra / up-all.
      - task: observability:init

  down-core:
    desc: "Остановить core контейнеры (Kafka + Observability) и удалить сеть"
    cmds:
      - echo '[task] 🛑 Останавливаем observability'
      - docker compose -f deploy/compose/observability/docker-compose.yml --env-file core.env down --volumes
      - echo '[task] 🛑 Останавливаем core контейнеры (Kafka)'
      - docker compose -f deploy/compose/core/docker-compose.yml --env-file core.env down --volumes
      - echo '[task] 🛑 Удаляем общую сеть microservices-net'
      - docker network rm microservices-net 2>/dev/null || true

  up-order:
    desc: "Поднять Order сервис и все его зависимости (включая накатку миграций)"
    dir: deploy/compose/order
    cmds:
      - echo "[task] 📦 Поднимаем Order с зависимостями"
      # core.env — источник GO_IMAGE/ALPINE_IMAGE/GOOSE_VERSION для build args migrator'а.
      # order/order.env — переопределяет POSTGRES_USER/PASSWORD/DB поверх него.
      # Сначала --wait поднимает postgres до healthy, затем `run --rm` прогоняет
      # одноразовый migrator и возвращает его exit-код. `up --wait` на весь compose
      # не годится: он считает завершившийся migrator упавшим, даже при exit 0.
      #
      # --progress plain и -T нужны, потому что up-* идут параллельно (up-infra:parallel):
      # tty-прогресс compose и TTY, который `run` выделяет контейнеру, переводят терминал
      # в raw, и вывод соседних задач печатается без возврата каретки — строки уезжают лесенкой.
      - docker compose --progress plain --env-file ../../../core.env --env-file compose.env up --detach --wait postgres-order
      - docker compose --progress plain --env-file ../../../core.env --env-file compose.env run --rm -T --build migrator-order

  down-order:
    desc: "Остановить и удалить Order сервис и все его зависимости"
    dir: deploy/compose/order
    cmds:
      - echo "[task] 🛑 Останавливаем Order с зависимостями"
      - docker compose --env-file ../../../core.env --env-file compose.env down --volumes

  up-inventory:
    desc: "Поднять Inventory сервис и все его зависимости (включая накатку миграций)"
    dir: deploy/compose/inventory
    cmds:
      - echo "[task] 📦 Поднимаем Inventory с зависимостями"
      # Сначала --wait поднимает postgres до healthy, затем `run --rm` прогоняет
      # одноразовый migrator и возвращает его exit-код (см. пояснение в up-order).
      # --progress plain и -T — оттуда же: не даём compose перехватывать терминал.
      - docker compose --progress plain --env-file ../../../core.env --env-file compose.env up --detach --wait postgres-inventory
      - docker compose --progress plain --env-file ../../../core.env --env-file compose.env run --rm -T --build migrator-inventory

  down-inventory:
    desc: "Остановить и удалить Inventory сервис и все его зависимости"
    dir: deploy/compose/inventory
    cmds:
      - echo "[task] 🛑 Останавливаем Inventory с зависимостями"
      - docker compose --env-file ../../../core.env --env-file compose.env down --volumes

  # Четыре стека — core (Kafka + observability) и три БД сервисов — друг от друга
  # не зависят: им нужна только общая сеть, которую создаёт net:create до них.
  # deps в Task выполняются параллельно, поэтому холодный старт Elasticsearch
  # и Kibana (десятки секунд, на нём ждёт observability:init) перекрывается
  # подъёмом баз и накаткой миграций, а не складывается с ними.
  up-infra:parallel:
    internal: true
    deps: [up-core, up-inventory, up-order, up-iam]

  up-infra:
    desc: "Поднять только инфраструктуру (Kafka, observability, БД с миграциями) — сервисы запускаются локально"
    cmds:
      # Сеть создаём до параллельного этапа: без неё стеки не поднимутся,
      # а создавать её одновременно из четырёх задач — гонка.
      - task: net:create
      # Каждая up-* задача поднимает БД до healthy и прогоняет migrator-контейнер,
      # так что отдельный прогон migrate:all:up не нужен.
      - task: up-infra:parallel
      # Kibana — последней: она грелась всё время, пока поднимались базы и Kafka,
      # так что здесь остаётся дождаться остатка вместо полных ~40 секунд.
      - task: kibana:init
      - echo "[task] ✅ Инфраструктура готова. Сервисы — task run:iam / run:inventory / run:payment / run:order / run:assembly"

  down-infra:
    desc: "Остановить инфраструктуру, поднятую через up-infra"
    cmds:
      - task: down-iam
      - task: down-order
      - task: down-inventory
      - task: down-core

  up-all:
    desc: "Поднять полную систему: инфраструктура + сервисы в контейнерах за Nginx (--scale order-service=3)"
    cmds:
      # Здесь не `task: up-infra`, а его шаги по отдельности — ради порядка:
      # сервисы собираются и стартуют, пока Kibana доходит до готовности,
      # и kibana:init остаётся последним. Через up-infra Kibana ждали бы до
      # сборки сервисов, то есть её прогрев не перекрывался бы ничем.
      - task: net:create
      - task: up-infra:parallel
      - echo "[task] ⚙️  Запускаем контейнеризованные сервисы (--scale order-service=3)"
      # --progress plain обязателен: tty-прогресс compose перехватывает терминал
      # (переводит его в raw), из-за чего и его собственная таблица, и весь вывод
      # после неё печатаются без возврата каретки — строки уезжают лесенкой.
      - >-
        docker compose
        --progress plain
        --env-file core.env
        -f deploy/compose/services/docker-compose.yml
        up -d --build --scale order-service=3
      - task: kibana:init

  down-all:
    desc: "Остановить всю систему: контейнеризованные сервисы + инфраструктура"
    cmds:
      - echo "[task] 🛑 Останавливаем контейнеризованные сервисы"
      - >-
        docker compose
        --env-file core.env
        -f deploy/compose/services/docker-compose.yml
        down
      - task: down-infra

  migrate:all:up:
    desc: "Применяет все миграции всех сервисов (goose с хоста; в up-* это делает migrator-контейнер)"
    cmds:
      - task migrate:order:up
      - task migrate:inventory:up
      - task migrate:iam:up

  # Внутренняя обёртка над goose: берёт креды из того же compose.env, которым
  # поднимается контейнер БД, и собирает из POSTGRES_* строку подключения.
  # Один источник истины — расхождение goose и docker compose невозможно.
  goose:exec:
    internal: true
    deps: [goose:install]
    dotenv: ['deploy/compose/{{.SVC}}/compose.env']
    requires:
      vars: [SVC, GOOSE_CMD]
    cmds:
      # POSTGRES_PORT — хостовый порт из compose-маппинга, поэтому goose ходит на localhost.
      - '{{.GOOSE}} -dir migrations/{{.SVC}} postgres "postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:$POSTGRES_PORT/$POSTGRES_DB?sslmode=disable" {{.GOOSE_CMD}}'

  # Создание файла миграции к БД не обращается — нужен только каталог migrations/<svc>.
  goose:create:
    internal: true
    deps: [goose:install]
    requires:
      vars: [SVC]
    cmds:
      - |
        name="{{.CLI_ARGS}}"
        if [ -z "$name" ]; then
          printf "Введите имя миграции: "; read name;
        fi
        mkdir -p "migrations/{{.SVC}}"
        {{.GOOSE}} -dir "migrations/{{.SVC}}" create "$name" sql

  migrate:order:up:
    desc: "Применяет все миграции Order-сервиса"
    cmds:
      - task: goose:exec
        vars: { SVC: order, GOOSE_CMD: up }

  migrate:order:down:
    desc: "Откатывает последнюю миграцию Order-сервиса"
    cmds:
      - task: goose:exec
        vars: { SVC: order, GOOSE_CMD: down }

  migrate:order:status:
    desc: "Показывает статус миграций Order-сервиса"
    cmds:
      - task: goose:exec
        vars: { SVC: order, GOOSE_CMD: status }

  migrate:order:create:
    desc: "Создаёт новый файл миграции Order-сервиса (task migrate:order:create -- <имя>)"
    cmds:
      - task: goose:create
        vars: { SVC: order }

  migrate:inventory:up:
    desc: "Применяет все миграции Inventory-сервиса"
    cmds:
      - task: goose:exec
        vars: { SVC: inventory, GOOSE_CMD: up }

  migrate:inventory:down:
    desc: "Откатывает последнюю миграцию Inventory-сервиса"
    cmds:
      - task: goose:exec
        vars: { SVC: inventory, GOOSE_CMD: down }

  migrate:inventory:status:
    desc: "Показывает статус миграций Inventory-сервиса"
    cmds:
      - task: goose:exec
        vars: { SVC: inventory, GOOSE_CMD: status }

  migrate:inventory:create:
    desc: "Создаёт новый файл миграции Inventory-сервиса (task migrate:inventory:create -- <имя>)"
    cmds:
      - task: goose:create
        vars: { SVC: inventory }

  up-iam:
    desc: "Поднять IAM сервис и все его зависимости (PostgreSQL + Redis + накатка миграций)"
    dir: deploy/compose/iam
    cmds:
      - echo "[task] 🔐 Поднимаем IAM с зависимостями (PostgreSQL + Redis)"
      # Сначала --wait поднимает postgres/redis до healthy, затем `run --rm` прогоняет
      # одноразовый migrator и возвращает его exit-код (см. пояснение в up-order).
      # --progress plain и -T — оттуда же: не даём compose перехватывать терминал.
      - docker compose --progress plain --env-file ../../../core.env --env-file compose.env up --detach --wait postgres-iam redis-iam
      - docker compose --progress plain --env-file ../../../core.env --env-file compose.env run --rm -T --build migrator-iam

  down-iam:
    desc: "Остановить и удалить IAM сервис и все его зависимости"
    dir: deploy/compose/iam
    cmds:
      - echo "[task] 🛑 Останавливаем IAM с зависимостями"
      - docker compose --env-file ../../../core.env --env-file compose.env down --volumes

  migrate:iam:up:
    desc: "Применяет все миграции IAM-сервиса"
    cmds:
      - task: goose:exec
        vars: { SVC: iam, GOOSE_CMD: up }

  migrate:iam:down:
    desc: "Откатывает последнюю миграцию IAM-сервиса"
    cmds:
      - task: goose:exec
        vars: { SVC: iam, GOOSE_CMD: down }

  migrate:iam:status:
    desc: "Показывает статус миграций IAM-сервиса"
    cmds:
      - task: goose:exec
        vars: { SVC: iam, GOOSE_CMD: status }

  migrate:iam:create:
    desc: "Создаёт новый файл миграции IAM-сервиса (task migrate:iam:create -- <имя>)"
    cmds:
      - task: goose:create
        vars: { SVC: iam }

  test:api:
    desc: "Запускает API-тесты"
    cmds:
      - go test -tags=apitest -v -count=1 ./iam/tests/...
      - go test -tags=apitest -v -count=1 ./inventory/tests/...
      - go test -tags=apitest -v -count=1 ./order/tests/...

  test:e2e:
    desc: "Запускает e2e-тесты order с реальной Kafka (Redpanda) через testcontainers"
    dir: order
    cmds:
      - echo '🚀 e2e order (Postgres + Redpanda через testcontainers)...'
      - go test -tags=e2e -count=1 -timeout=300s -v ./tests/e2e/...

  es:wait:
    silent: true # не эхоим сам скрипт: в параллельном выводе он превращается в кашу
    desc: "Ожидает готовности Elasticsearch"
    cmds:
      - echo "⏳ Ожидаем готовности Elasticsearch..."
      - |
        for i in $(seq 1 60); do
          curl -sSf {{.ELASTICSEARCH_URL}}/_cluster/health >/dev/null 2>&1 && break
          sleep 2
        done

  es:create-template:
    silent: true # не эхоим сам скрипт: в параллельном выводе он превращается в кашу
    desc: "Создает index template для data stream otel-logs (нужен в ECS-режиме экспортера)"
    cmds:
      # OTel Collector шлёт логи с require_data_stream=true. Elasticsearch НЕ создаёт
      # data stream автоматически без index template и отвечает index_not_found_exception,
      # из-за чего все логи теряются. Шаблон делает otel-logs* auto-create как data stream.
      # number_of_replicas=0 — кластер из одной ноды, иначе индекс висит в статусе yellow.
      - echo "📝 Создаем index template otel-logs-template (data stream)..."
      - |
        curl -sS -X PUT {{.ELASTICSEARCH_URL}}/_index_template/otel-logs-template \
          -H "Content-Type: application/json" \
          --data '{"index_patterns":["otel-logs*"],"data_stream":{},"priority":500,"template":{"settings":{"number_of_replicas":0}}}'
        echo ""
        echo "✅ Index template otel-logs-template создан"

  es:init:
    desc: "Ожидает Elasticsearch и создает index template для data stream"
    cmds:
      - task: es:wait
      - task: es:create-template

  kibana:wait:
    silent: true # не эхоим сам скрипт: в параллельном выводе он превращается в кашу
    desc: "Ожидает готовности Kibana"
    cmds:
      - echo '⏳ Ожидаем готовности Kibana...'
      - |
        # Ждём именно overall.level == available, а не просто ответа от /api/status.
        # Отвечать Kibana начинает раньше, чем поднимет плагины, и в этом окне
        # POST /api/data_views возвращает ошибку — из-за этого kibana:create-view
        # падал с пустым Data View ID.
        for i in $(seq 1 90); do
          level=$(curl -sf -m 5 {{.KIBANA_URL}}/api/status 2>/dev/null \
            | jq -r '.status.overall.level // empty' 2>/dev/null)
          [ "$level" = "available" ] && break
          sleep 2
        done
        if [ "$level" != "available" ]; then
          echo "❌ Kibana не вышла в состояние available за 180 секунд (последнее: ${level:-нет ответа})"
          exit 1
        fi
        echo '✅ Kibana готова'

  kibana:create-view:
    silent: true # не эхоим сам скрипт: в параллельном выводе он превращается в кашу
    desc: "Создает Data View в Kibana и устанавливает его как default"
    cmds:
      - echo '📝 Создаем Data View otel-logs*...'
      - |
        # Несколько попыток: даже после overall.level=available у Kibana бывает
        # короткое окно, когда saved objects ещё не готовы принимать запись.
        DATA_VIEW_ID=""
        for i in 1 2 3 4 5; do
          RESPONSE=$(curl -sS -X POST {{.KIBANA_URL}}/api/data_views/data_view \
            -H "kbn-xsrf: true" \
            -H "Content-Type: application/json" \
            --data '{"data_view":{"title":"otel-logs*","name":"OTel Logs","timeFieldName":"@timestamp","allowNoIndex":true},"override":true}')
          DATA_VIEW_ID=$(echo "$RESPONSE" | jq -r ".data_view.id // empty" 2>/dev/null)
          [ -n "$DATA_VIEW_ID" ] && break
          sleep 3
        done

        if [ -z "$DATA_VIEW_ID" ]; then
          # Печатаем ответ Kibana: без него ошибка выглядит как пустой ID
          # и понять причину нельзя.
          echo '❌ Не удалось создать Data View. Ответ Kibana:'
          echo "$RESPONSE"
          exit 1
        fi

        echo "Data View ID: $DATA_VIEW_ID"
        curl -sS -X POST {{.KIBANA_URL}}/api/data_views/default \
          -H "kbn-xsrf: true" \
          -H "Content-Type: application/json" \
          -d "{\"data_view_id\": \"$DATA_VIEW_ID\", \"force\": true}"
        echo '✅ Data View создан и установлен как default'

  kibana:init:
    desc: "Ожидает Kibana и создает Data View для просмотра логов"
    cmds:
      - task: kibana:wait
      - task: kibana:create-view

  kafka:wait:
    silent: true # не эхоим сам скрипт: в параллельном выводе он превращается в кашу
    desc: "Ожидает готовности брокера Kafka"
    cmds:
      - echo '⏳ Ожидаем готовности Kafka...'
      - |
        for i in $(seq 1 60); do
          docker exec kafka kafka-topics --bootstrap-server kafka:{{.KAFKA_INTERNAL_PORT}} --list >/dev/null 2>&1 && break
          sleep 2
        done
        if ! docker exec kafka kafka-topics --bootstrap-server kafka:{{.KAFKA_INTERNAL_PORT}} --list >/dev/null 2>&1; then
          echo '❌ Kafka не поднялась за 120 секунд'
          exit 1
        fi
        echo '✅ Kafka готова'

  kafka:create-topics:
    silent: true # не эхоим сам скрипт: в параллельном выводе он превращается в кашу
    desc: "Создаёт топики order.paid и assembly.ship-assembled (идемпотентно)"
    cmds:
      # KAFKA_AUTO_CREATE_TOPICS_ENABLE=true не годится как единственный механизм:
      # автосоздание срабатывает по запросу метаданных и асинхронно, а консьюмер
      # order-service, получив UNKNOWN_TOPIC_OR_PARTITION, роняет всё приложение
      # (order/internal/app/app.go:71) — restart-политики у сервисов нет, контейнер
      # остаётся мёртвым. down-core гасит Kafka с --volumes, поэтому топики нужно
      # заводить при каждом подъёме.
      #
      # 3 партиции — чтобы все три реплики order-service из одной consumer group
      # разобрали разделы и читали параллельно, а не простаивали.
      - echo '📝 Создаём топики Kafka...'
      - |
        set -e
        for topic in order.paid assembly.ship-assembled; do
          docker exec kafka kafka-topics --bootstrap-server kafka:{{.KAFKA_INTERNAL_PORT}} \
            --create --if-not-exists --topic "$topic" --partitions 3 --replication-factor 1
        done
        echo '✅ Топики готовы:'
        docker exec kafka kafka-topics --bootstrap-server kafka:{{.KAFKA_INTERNAL_PORT}} --list

  kafka:init:
    desc: "Ожидает Kafka и создаёт топики, нужные сервисам"
    cmds:
      - task: kafka:wait
      - task: kafka:create-topics

  jaeger:wait:
    silent: true # не эхоим сам скрипт: в параллельном выводе он превращается в кашу
    desc: "Ожидает готовности Jaeger (приём спанов и UI)"
    cmds:
      # Отдельного init у трейсов нет: Jaeger хранит сервисы и операции сам,
      # заводить ничего не нужно. Но up-* не должен завершаться раньше, чем
      # Jaeger начнёт отвечать, иначе UI на localhost:16686 встречает пустотой.
      - echo '⏳ Ожидаем готовности Jaeger...'
      - |
        for i in $(seq 1 60); do
          curl -sSf {{.JAEGER_URL}}/api/services >/dev/null 2>&1 && break
          sleep 2
        done
        if ! curl -sSf {{.JAEGER_URL}}/api/services >/dev/null 2>&1; then
          echo '❌ Jaeger не поднялся за 120 секунд ({{.JAEGER_URL}})'
          exit 1
        fi
        echo '✅ Jaeger готов'

  # Один шаг инициализации всего observability-стека — вызывается из up-core,
  # то есть отрабатывает и в up-infra, и в up-all. Руками после up-* запускать
  # ничего не нужно: логи в Kibana и трейсы в Jaeger доступны сразу.
  observability:init:
    desc: "Готовит observability: index template в ES и ожидание Jaeger"
    cmds:
      # kibana:init сюда намеренно не входит: Kibana стартует ~40 секунд, и если
      # ждать её здесь, это время встаёт в критический путь up-*. Вместо этого
      # её дожидаются последним шагом up-infra / up-all, когда всё остальное
      # уже поднято и Kibana успела прогреться параллельно.
      - task: es:init
      - task: jaeger:wait

  vegeta:install:
    desc: "Устанавливает vegeta (HTTP нагрузочное тестирование)"
    cmds:
      - GOBIN={{.BIN_DIR}} go install github.com/tsenart/vegeta/v12@{{.VEGETA_VERSION}}
    status:
      - test -x {{.VEGETA}}

  # Готовит детали под нагрузочный тест: заводит их, если нет, и сбрасывает состояние.
  #
  # Каждый успешный Create резервирует по одной детали (available = stock_quantity - reserved),
  # и резерв не освобождается. Без сброса второй прогон стартует с уже подъеденным
  # остатком, а на N-ном упрётся в потолок: order-service начнёт отдавать 409,
  # метрика orders_created перестанет расти и в Grafana «Заказы в минуту» ляжет в ноль.
  #
  # Живёт здесь, а не в migrations/inventory, потому что это фикстура нагрузочного
  # теста, а не часть схемы: миграция протащила бы её во все окружения, включая прод,
  # и правка остатка требовала бы новой миграции. ON CONFLICT делает задачу
  # идемпотентной — она сама чинит состояние на любой БД, сколько бы прогонов
  # ни прошло до неё.
  #
  # Детали отдельные (10ad7e57-… ≈ "loadtest"), сидовые (550e8400-…) не трогаем:
  # на их остатках и резерве держатся API- и e2e-тесты.
  # Корпус strength=200 и двигатель класса C (required_strength=30) — пара заведомо
  # проходит ValidateCompatibility, ни один заказ не отсеется на несовместимости.
  #
  # Пар именно LOAD_PAIRS, а не одна: Reserve берёт SELECT ... FOR UPDATE на строки
  # деталей, поэтому все заказы на одну и ту же пару выстраиваются в очередь на двух
  # строках и тест меряет стоимость блокировки, а не сервис. На нескольких парах
  # (load:http чередует их) очередь распадается на независимые.
  load:seed:
    silent: true # не эхоим сам скрипт: в параллельном выводе он превращается в кашу
    desc: "Заводит и пополняет детали под нагрузочный тест (вызывается из load:http)"
    cmds:
      - |
        set -e
        # Без set -e ненулевой код psql затрётся финальным echo, и задача
        # молча отрапортует об успехе на несброшенных остатках.

        if ! docker ps --format '{{`{{.Names}}`}}' | grep -qx 'postgres-inventory'; then
          echo '❌ Контейнер postgres-inventory не запущен (нужен task up-all)'
          exit 1
        fi

        # Креды берём из окружения самого контейнера (env_file: compose.env),
        # чтобы не дублировать их в Taskfile. SQL передаём через stdin (docker exec -i),
        # иначе кавычки SQL-литералов пришлось бы экранировать через '"'"'.
        # UUID пар строятся детерминированно, чтобы load:http собрал ровно те же:
        #   корпус   10ad7e57-0000-4000-8000-1000000000NN
        #   двигатель 10ad7e57-0000-4000-8000-2000000000NN
        docker exec -i postgres-inventory sh -c \
          'psql -q -v ON_ERROR_STOP=1 -v pairs={{.LOAD_PAIRS}} -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
        INSERT INTO parts (uuid, name, description, part_type, price, stock_quantity, properties)
        SELECT ('10ad7e57-0000-4000-8000-1000000000' || lpad(i::text, 2, '0'))::uuid,
               'Нагрузочный корпус #' || i,
               'Корпус для нагрузочного теста (task load:http)',
               'HULL', 100000, 1000000, '{"hull": {"strength": 200}}'::jsonb
          FROM generate_series(1, :pairs) AS i
        UNION ALL
        SELECT ('10ad7e57-0000-4000-8000-2000000000' || lpad(i::text, 2, '0'))::uuid,
               'Нагрузочный двигатель #' || i,
               'Двигатель для нагрузочного теста (task load:http)',
               'ENGINE', 100000, 1000000, '{"engine": {"class": "C", "required_strength": 30}}'::jsonb
          FROM generate_series(1, :pairs) AS i
        ON CONFLICT (uuid) DO UPDATE
          SET stock_quantity = EXCLUDED.stock_quantity,
              properties     = EXCLUDED.properties,
              reserved       = 0;
        SQL
        echo '📦 Нагрузочные детали готовы (1 000 000 шт., резерв сброшен)'

  # Нагрузочный тест HTTP: ступенчатый рост 50 → 500 RPS за 2.5 минуты.
  # Запуск: task up-all (в одном терминале), task load:http (в другом).
  # Результаты смотреть в Grafana (localhost:3000).
  load:http:
    desc: "Нагрузочный тест HTTP: POST с нарастающей нагрузкой (50 → 500 RPS за 2.5 мин)"
    deps: [vegeta:install, buf:install]
    cmds:
      - task: load:seed
      - |
        VEGETA="{{.VEGETA}}"
        RESULTS_DIR=$(mktemp -d)
        TARGETS_FILE="$RESULTS_DIR/targets.txt"
        trap 'rm -rf "$RESULTS_DIR"' EXIT

        # Заводим отдельного пользователя и логинимся: /api/v1/orders закрыт
        # auth-middleware, без заголовка Authorization тест меряет только 401.
        LOGIN="load-test-$(date +%s)"
        {{.BUF}} curl --schema shared/proto --protocol grpc --http2-prior-knowledge \
          -d "{\"info\":{\"info\":{\"login\":\"$LOGIN\"},\"password\":\"LoadTest123!\"}}" \
          http://localhost:50053/user.v1.UserService/Register >/dev/null
        SESSION=$({{.BUF}} curl --schema shared/proto --protocol grpc --http2-prior-knowledge \
          -d "{\"login\":\"$LOGIN\",\"password\":\"LoadTest123!\"}" \
          http://localhost:50053/auth.v1.AuthService/Login | jq -r '.sessionUuid')
        if [ -z "$SESSION" ] || [ "$SESSION" = "null" ]; then
          echo '❌ Не удалось получить сессию в IAM (сервисы подняты? task up-all)'
          exit 1
        fi
        echo "🔑 Сессия получена для $LOGIN"

        # По цели на каждую пару деталей из load:seed — vegeta идёт по файлу
        # целей по кругу, поэтому заказы равномерно размазываются по парам.
        # Одна пара на весь тест означала бы очередь всех заказов на двух строках
        # в SELECT ... FOR UPDATE (см. Reserve в inventory) — тест мерил бы
        # стоимость блокировки, а не пропускную способность сервиса.
        # UUID строятся по той же схеме, что и в load:seed.
        : > "$TARGETS_FILE"
        for i in $(seq 1 {{.LOAD_PAIRS}}); do
          idx=$(printf '%02d' "$i")
          printf '{"hull_uuid":"10ad7e57-0000-4000-8000-1000000000%s","engine_uuid":"10ad7e57-0000-4000-8000-2000000000%s"}\n' \
            "$idx" "$idx" > "$RESULTS_DIR/body-$idx.json"
          printf 'POST http://localhost:8080/api/v1/orders\n@%s\n\n' \
            "$RESULTS_DIR/body-$idx.json" >> "$TARGETS_FILE"
        done
        echo "🎯 Целей в ротации: {{.LOAD_PAIRS}} (по паре деталей на каждую)"

        # Ожидаемая картина: часть запросов — 201, часть — 429 от rate limiter
        # (rate_limit в config.docker.yaml). 409 быть не должно: остаток на
        # нагрузочных деталях (1 000 000) не выбрать даже если пройдут все
        # ~41 000 запросов прогона, а резерв от прошлых прогонов снял load:seed.
        for rate in 50 100 150 200 250 300 350 400 450 500; do
          echo "⏱️  ступень: ${rate} RPS (15 сек)"
          $VEGETA attack -targets="$TARGETS_FILE" -rate="${rate}/s" -duration=15s \
              -header="Content-Type: application/json" \
              -header="Authorization: Bearer $SESSION" | \
            $VEGETA encode --to json >> "$RESULTS_DIR/results.json"
        done

        $VEGETA report -type=json < "$RESULTS_DIR/results.json"
