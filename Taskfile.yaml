version: '3'

# core.env is the source of the image versions used when building containers.
# GO_IMAGE / ALPINE_IMAGE / GOOSE_VERSION from it are automatically available
# as {{.GO_IMAGE}} and so on in the tasks below.
dotenv: ['core.env']

vars:
  GO_VERSION: '1.26.0'
  GOLANGCI_LINT_VERSION: 'v2.12.2'
  GCI_VERSION: 'v0.14.0'
  GOFUMPT_VERSION: 'v0.10.0'
  BUF_VERSION: '1.69.0'
  PROTOC_GEN_GO_VERSION: 'v1.36.11'
  PROTOC_GEN_GO_GRPC_VERSION: 'v1.6.1'
  OGEN_VERSION: 'v1.20.3'

  BIN_DIR: '{{.ROOT_DIR}}/bin'
  GOLANGCI_LINT: '{{.BIN_DIR}}/golangci-lint'
  GCI: '{{.BIN_DIR}}/gci'
  GOFUMPT: '{{.BIN_DIR}}/gofumpt'
  BUF: '{{.BIN_DIR}}/buf'
  PROTOC_GEN_GO: '{{.BIN_DIR}}/protoc-gen-go'
  PROTOC_GEN_GO_GRPC: '{{.BIN_DIR}}/protoc-gen-go-grpc'
  OGEN: '{{.BIN_DIR}}/ogen'

  MOCKERY_VERSION: 'v3.7.0'
  MOCKERY: '{{.BIN_DIR}}/mockery'

  # GOOSE_VERSION comes from core.env through dotenv: a single source of truth for the
  # goose version, used both by the host install here and by migrator.Dockerfile
  GOOSE: '{{.BIN_DIR}}/goose'

  COVERAGE_DIR: '{{.ROOT_DIR}}/coverage'
  COVERAGE_FILE: '{{.COVERAGE_DIR}}/coverage.out'
  COVERAGE_THRESHOLD: '40'

  KIBANA_URL: 'http://localhost:5601'
  ELASTICSEARCH_URL: 'http://localhost:9200'
  JAEGER_URL: 'http://localhost:16686'

  VEGETA_VERSION: 'v12.13.0'
  VEGETA: '{{.BIN_DIR}}/vegeta'

  # How many hull+engine pairs to seed for the load test. Used both by load:seed (what to
  # create) and by load:http (what to rotate requests over), so the values must match and
  # live in one place.
  LOAD_PAIRS: 10

  MODULES: iam assembly order inventory payment

  # Repository module prefix: gci uses it to put project-local imports into their own group.
  MODULE_PREFIX: 'github.com/vixart/rocket-factory'

tasks:
  formatters:install:
    desc: "Installs gofumpt and gci"
    cmds:
      - echo '📦 Installing gofumpt...'
      - GOBIN={{.BIN_DIR}} go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}
      - echo '📦 Installing gci...'
      - GOBIN={{.BIN_DIR}} go install github.com/daixiang0/gci@{{.GCI_VERSION}}
    status:
      - test -x {{.GOFUMPT}}
      - test -x {{.GCI}}

  golangci-lint:install:
    desc: "Installs golangci-lint"
    cmds:
      - echo '📦 Installing golangci-lint...'
      - GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
    status:
      - test -x {{.GOLANGCI_LINT}}

  buf:install:
    desc: "Installs buf"
    cmds:
      - echo '📦 Installing buf...'
      - GOBIN={{.BIN_DIR}} go install github.com/bufbuild/buf/cmd/buf@v{{.BUF_VERSION}}
    status:
      - test -x {{.BUF}}

  proto:install-plugins:
    desc: "Installs the protoc plugins"
    cmds:
      - echo '📦 Installing protoc-gen-go...'
      - GOBIN={{.BIN_DIR}} go install google.golang.org/protobuf/cmd/protoc-gen-go@{{.PROTOC_GEN_GO_VERSION}}
      - echo '📦 Installing protoc-gen-go-grpc...'
      - GOBIN={{.BIN_DIR}} go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@{{.PROTOC_GEN_GO_GRPC_VERSION}}
    status:
      - test -x {{.PROTOC_GEN_GO}}
      - test -x {{.PROTOC_GEN_GO_GRPC}}

  ogen:install:
    desc: "Installs ogen"
    cmds:
      - echo '📦 Installing ogen...'
      - GOBIN={{.BIN_DIR}} go install github.com/ogen-go/ogen/cmd/ogen@{{.OGEN_VERSION}}
    status:
      - test -x {{.OGEN}}

  setup:
    desc: "Installs every development tool"
    deps: [formatters:install, golangci-lint:install, buf:install, proto:install-plugins, ogen:install]

  run:order:
    desc: "Runs OrderService (HTTP server on :8080)"
    dir: order
    cmds:
      - go run ./cmd

  run:inventory:
    desc: "Runs InventoryService (gRPC server on :50051)"
    dir: inventory
    cmds:
      - go run ./cmd

  run:payment:
    desc: "Runs PaymentService (gRPC server on :50052)"
    dir: payment
    cmds:
      - go run ./cmd

  run:iam:
    desc: "Runs IAMService (authentication gRPC server on :50053)"
    dir: iam
    cmds:
      - go run ./cmd

  run:assembly:
    desc: "Runs AssemblyService (Kafka consumer/producer)"
    dir: assembly
    cmds:
      - go run ./cmd

  format:
    desc: "Formats the code (gofumpt + gci)"
    deps: [formatters:install]
    cmds:
      - echo '🧹 Formatting the code with gofumpt...'
      - find . -type f -name '*.go' ! -path '*/mocks/*' ! -path '*/pkg/proto/*' ! -path '*/pkg/openapi/*' -exec {{.GOFUMPT}} -extra -w {} +
      - echo '📦 Sorting imports with gci...'
      - find . -type f -name '*.go' ! -path '*/mocks/*' ! -path '*/pkg/proto/*' ! -path '*/pkg/openapi/*' -exec {{.GCI}} write -s standard -s default -s "prefix({{.MODULE_PREFIX}})" {} +

  hooks:install:
    desc: "Installs the git hooks from scripts/ into .git/hooks (with the executable bit)"
    cmds:
      - echo '🪝 Installing the pre-commit hook...'
      # Without the copy the hook stays non-executable, and git silently skips such hooks.
      - cp scripts/pre-commit .git/hooks/pre-commit
      - chmod +x .git/hooks/pre-commit
      - echo '✅ Hook installed at .git/hooks/pre-commit'

  build:
    desc: "Builds every Go module (go build)"
    cmds:
      - go build ./iam/... ./assembly/... ./order/... ./inventory/... ./payment/... ./platform/...

  lint:
    desc: "Runs golangci-lint"
    deps: [golangci-lint:install]
    cmds:
      - '{{.GOLANGCI_LINT}} run --allow-parallel-runners ./iam/... ./assembly/... order/... inventory/... payment/... platform/... --config=.golangci.yml'

  proto:format:
    desc: "Formats the .proto files (buf format)"
    deps: [buf:install]
    dir: shared/proto
    cmds:
      - echo '🧹 Formatting the .proto files...'
      - '{{.BUF}} format -w'

  proto:lint:
    desc: "Lints the .proto files"
    deps: [buf:install, proto:install-plugins, proto:format]
    dir: shared/proto
    cmds:
      - echo '🔍 Linting the .proto files...'
      - '{{.BUF}} lint'

  proto:gen:
    desc: "Generates Go code from .proto"
    deps: [buf:install, proto:install-plugins, proto:format]
    dir: shared/proto
    cmds:
      - echo '🔨 Generating Go code from .proto...'
      - '{{.BUF}} generate'

  ogen:gen:
    desc: "Generates Go code from OpenAPI"
    deps: [ogen:install]
    dir: shared
    cmds:
      - echo '🔨 Generating Go code from OpenAPI...'
      - '{{.OGEN}} -target ./pkg/openapi/order/v1 -package orderv1 -clean ./api/order/v1/order.openapi.yaml 2>/dev/null'

  gen:
    desc: "Generates all code"
    cmds:
      - task: proto:gen
      - task: ogen:gen

  deps:update:
    desc: "Updates the dependencies"
    cmds:
      - echo '🔄 Syncing go.work...'
      - go work sync
      - echo '🔄 Updating the service dependencies...'
      - for: { var: MODULES }
        cmd: cd {{.ITEM}} && go mod tidy -compat={{.GO_VERSION}}
      - echo '🔄 Updating the platform dependencies...'
      - cd platform && go mod tidy -compat={{.GO_VERSION}}
      - echo '🔄 Updating the shared dependencies (proto/openapi)...'
      - cd shared && go mod tidy -compat={{.GO_VERSION}}

  mockery:install:
    desc: "Installs mockery"
    cmds:
      - echo '📦 Installing mockery...'
      - GOBIN={{.BIN_DIR}} go install github.com/vektra/mockery/v3@{{.MOCKERY_VERSION}}
    status:
      - test -x {{.MOCKERY}}

  mocks:gen:
    desc: "Generates the interface mocks"
    deps: [mockery:install]
    cmds:
      - echo '🧪 Generating mocks...'
      - '{{.MOCKERY}}'

  test:
    desc: "Runs the unit tests with the race detector"
    cmds:
      - for: [ 'assembly', 'iam', 'inventory', 'order', 'payment' ]
        cmd: |
          echo "=== {{.ITEM}} ==="
          cd {{.ITEM}} && go test -v -race -count=1 ./...

  coverage:clean:
    desc: "Cleans the coverage report directory"
    internal: true
    cmds:
      - rm -rf {{.COVERAGE_DIR}}
      - mkdir -p {{.COVERAGE_DIR}}

  test:coverage:
    desc: "Tests with business logic coverage"
    deps: [coverage:clean]
    vars:
      TARGET_PACKAGES:
        sh: |
          for mod in order inventory payment; do
            (cd "$mod" && go list ./... | grep -v "/mocks" | grep -E '/(api|service)/')
          done | tr '\n' ','
    preconditions:
      - sh: test -n "{{.TARGET_PACKAGES}}"
        msg: "No packages to test"
    cmds:
      - echo "📦 Target packages:{{.TARGET_PACKAGES}}"
      - for: ['iam', 'assembly', 'order', 'inventory', 'payment']
        cmd: |
          echo "=== {{.ITEM}} ==="
          cd {{.ITEM}} && go test -v -race -covermode=atomic -coverprofile={{.COVERAGE_DIR}}/{{.ITEM}}.out -coverpkg={{.TARGET_PACKAGES}} ./...
      - echo "📊 Merging the coverage reports..."
      - head -1 {{.COVERAGE_DIR}}/order.out > {{.COVERAGE_FILE}}
      - for: ['iam', 'assembly', 'order', 'inventory', 'payment']
        cmd: tail -n +2 {{.COVERAGE_DIR}}/{{.ITEM}}.out >> {{.COVERAGE_FILE}}
      - echo "📊 Coverage per function:"
      - go tool cover -func={{.COVERAGE_FILE}}
      - task: coverage:threshold

  coverage:threshold:
    desc: "Checks the coverage against the threshold"
    internal: true
    vars:
      COVERAGE:
        sh: go tool cover -func={{.COVERAGE_FILE}} | tail -n1 | awk '{print $NF}' | tr -d '%'
    preconditions:
      - sh: test -f {{.COVERAGE_FILE}}
        msg: "Coverage file not found. Run task test:coverage"
    cmds:
      - echo "🧾 Total coverage:{{.COVERAGE}}% | threshold:{{.COVERAGE_THRESHOLD}}%"
      - cmd: test $(echo "{{.COVERAGE}} >= {{.COVERAGE_THRESHOLD}}" | bc) -eq 1
      - echo "✅ Coverage meets the threshold"

  coverage:badge:
    desc: "Builds coverage/badge.json for the shields.io endpoint badge in the README"
    vars:
      COVERAGE:
        sh: go tool cover -func={{.COVERAGE_FILE}} | tail -n1 | awk '{print $NF}' | tr -d '%'
    preconditions:
      - sh: test -f {{.COVERAGE_FILE}}
        msg: "Coverage file not found. Run task test:coverage"
    cmds:
      # The format is dictated by shields.io (endpoint badge): without
      # schemaVersion/label/message the badge renders as "invalid response data".
      - |
        pct='{{.COVERAGE}}'
        color=$(awk -v p="$pct" -v t={{.COVERAGE_THRESHOLD}} 'BEGIN{
          print p>=90 ? "brightgreen" : p>=75 ? "green" : p>=60 ? "yellowgreen" : p>=t ? "yellow" : "red"
        }')
        printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
          "$pct" "$color" > {{.COVERAGE_DIR}}/badge.json
        echo "🏷  $(cat {{.COVERAGE_DIR}}/badge.json)"

  coverage:html:
    desc: "Generates the HTML coverage report"
    deps: [test:coverage]
    vars:
      HTML_FILE: '{{.COVERAGE_DIR}}/coverage.html'
    cmds:
      - go tool cover -html={{.COVERAGE_FILE}} -o {{.HTML_FILE}}
      - echo "🌐 Report saved to {{.HTML_FILE}}"
      - cmd: open {{.HTML_FILE}}
        platforms: [darwin]

  coverage:check:
    desc: "Checks coverage without running the tests"
    cmds:
      - task: coverage:threshold

  goose:install:
    desc: "Installs goose (database migrations)"
    cmds:
      - echo '📦 Installing goose...'
      - GOBIN={{.BIN_DIR}} go install github.com/pressly/goose/v3/cmd/goose@{{.GOOSE_VERSION}}
    status:
      - test -x {{.GOOSE}}

  net:create:
    silent: true # do not echo the script itself: in parallel output it turns into noise
    desc: "Creates the shared docker network microservices-net (idempotent)"
    cmds:
      # Only create: there used to be a `network rm` here as well, but it is incompatible
      # with bringing the stacks up in parallel (up-infra:parallel): removing the network
      # from under already starting containers breaks their connectivity. down-core removes
      # the network, which is enough.
      - docker network create microservices-net 2>/dev/null || true

  up-core:
    desc: "Creates the shared network and starts the core containers (Kafka + observability)"
    cmds:
      - echo '[task] 🌐 Creating the shared network microservices-net'
      - task: net:create
      - echo '[task] 🚀 Starting the core containers (Kafka + Redis for the rate limiter)'
      # --progress plain: up-core runs in parallel with the databases, and the compose tty
      # progress writer hijacks the terminal and mangles the output of neighbouring tasks.
      - docker compose --progress plain -f deploy/compose/core/docker-compose.yml --env-file core.env up --build --detach
      - echo '[task] 📊 Starting observability (OTel Collector, ES, Kibana, Prometheus, Grafana, Jaeger)'
      # One container at a time with --no-deps, on purpose. A plain `up --detach` does not
      # return until depends_on: condition: service_healthy is satisfied, which holds the
      # Kibana start back until Elasticsearch is healthy — about 55 seconds of foreground
      # waiting. Kibana and the collector reconnect on their own, so it is cheaper to start
      # everything at once and wait for readiness below (es:init) and at the very end of
      # up-* (kibana:init) — by then Kibana has warmed up in parallel with the rest of the
      # infrastructure.
      - |
        for svc in elasticsearch kibana jaeger prometheus grafana otel-collector; do
          docker compose --progress plain -f deploy/compose/observability/docker-compose.yml --env-file core.env \
            up --build --detach --no-deps "$svc"
        done
      # Create the topics before the services start: KAFKA_AUTO_CREATE_TOPICS_ENABLE does
      # not help, because the consumer reaches the topic before the broker creates it, gets
      # UNKNOWN_TOPIC_OR_PARTITION and brings the whole service down (see kafka:create-topics).
      # It runs after observability so that ES and Kibana warm up while we wait for the broker.
      - task: kafka:init
      # Without the otel-logs index template the collector exporter gets
      # index_not_found_exception and the logs are lost, so ES is awaited here.
      # The Kibana data view is created as the last step of up-infra / up-all.
      - task: observability:init

  down-core:
    desc: "Stops the core containers (Kafka + observability) and removes the network"
    cmds:
      - echo '[task] 🛑 Stopping observability'
      - docker compose -f deploy/compose/observability/docker-compose.yml --env-file core.env down --volumes
      - echo '[task] 🛑 Stopping the core containers (Kafka)'
      - docker compose -f deploy/compose/core/docker-compose.yml --env-file core.env down --volumes
      - echo '[task] 🛑 Removing the shared network microservices-net'
      - docker network rm microservices-net 2>/dev/null || true

  up-order:
    desc: "Starts the Order service with every dependency (migrations included)"
    dir: deploy/compose/order
    cmds:
      - echo "[task] 📦 Starting Order with its dependencies"
      # core.env provides GO_IMAGE/ALPINE_IMAGE/GOOSE_VERSION as build args for the migrator.
      # order/order.env overrides POSTGRES_USER/PASSWORD/DB on top of it.
      # First --wait brings postgres up to healthy, then `run --rm` runs the one-shot
      # migrator and returns its exit code. `up --wait` over the whole compose file will
      # not do: it treats the finished migrator as failed even on exit 0.
      #
      # --progress plain and -T are needed because the up-* tasks run in parallel
      # (up-infra:parallel): the compose tty progress and the TTY that `run` allocates for the
      # container both switch the terminal to raw mode, and output from neighbouring tasks is
      - docker compose --progress plain --env-file ../../../core.env --env-file compose.env up --detach --wait postgres-order
      - docker compose --progress plain --env-file ../../../core.env --env-file compose.env run --rm -T --build migrator-order

  down-order:
    desc: "Stops and removes the Order service with every dependency"
    dir: deploy/compose/order
    cmds:
      - echo "[task] 🛑 Stopping Order with its dependencies"
      - docker compose --env-file ../../../core.env --env-file compose.env down --volumes

  up-inventory:
    desc: "Starts the Inventory service with every dependency (migrations included)"
    dir: deploy/compose/inventory
    cmds:
      - echo "[task] 📦 Starting Inventory with its dependencies"
      # First --wait brings postgres up to healthy, then `run --rm` runs the one-shot
      # migrator and returns its exit code (see the explanation in up-order).
      # --progress plain and -T come from there too: compose must not hijack the terminal.
      - docker compose --progress plain --env-file ../../../core.env --env-file compose.env up --detach --wait postgres-inventory
      - docker compose --progress plain --env-file ../../../core.env --env-file compose.env run --rm -T --build migrator-inventory

  down-inventory:
    desc: "Stops and removes the Inventory service with every dependency"
    dir: deploy/compose/inventory
    cmds:
      - echo "[task] 🛑 Stopping Inventory with its dependencies"
      - docker compose --env-file ../../../core.env --env-file compose.env down --volumes

  # Four stacks — core (Kafka + observability) and the three service databases — do not
  # depend on each other: all they need is the shared network created by net:create.
  # Task runs deps in parallel, so the cold start of Elasticsearch and Kibana (tens of
  # seconds, which observability:init waits on) overlaps with bringing the databases up
  # and applying the migrations instead of adding to it.
  up-infra:parallel:
    internal: true
    deps: [up-core, up-inventory, up-order, up-iam]

  up-infra:
    desc: "Starts the infrastructure only (Kafka, observability, databases with migrations) — services run locally"
    cmds:
      # The network is created before the parallel stage: without it the stacks cannot start,
      # and creating it from four tasks at once would be a race.
      - task: net:create
      # Every up-* task brings its database up to healthy and runs the migrator container,
      # so a separate migrate:all:up run is unnecessary.
      - task: up-infra:parallel
      # Kibana comes last: it was warming up the whole time the databases and Kafka were
      # starting, so only the remainder is awaited here instead of the full ~40 seconds.
      - task: kibana:init
      - echo "[task] ✅ Infrastructure is ready. Run services with task run:iam / run:inventory / run:payment / run:order / run:assembly"

  down-infra:
    desc: "Stops the infrastructure started by up-infra"
    cmds:
      - task: down-iam
      - task: down-order
      - task: down-inventory
      - task: down-core

  up-all:
    desc: "Starts the whole system: infrastructure + containerized services behind Nginx (--scale order-service=3)"
    cmds:
      # The steps of up-infra are listed separately rather than calling `task: up-infra`,
      # for ordering: the services build and start while Kibana becomes ready, and
      # kibana:init stays last. Through up-infra, Kibana would be awaited before the
      # services are built, so its warm-up would overlap with nothing.
      - task: net:create
      - task: up-infra:parallel
      - echo "[task] ⚙️  Starting the containerized services (--scale order-service=3)"
      # --progress plain is required: the compose tty progress hijacks the terminal (switching
      # it to raw mode), so both its own table and everything printed afterwards come out
      # without carriage returns and the lines drift to the right.
      - >-
        docker compose
        --progress plain
        --env-file core.env
        -f deploy/compose/services/docker-compose.yml
        up -d --build --scale order-service=3
      - task: kibana:init

  down-all:
    desc: "Stops the whole system: containerized services + infrastructure"
    cmds:
      - echo "[task] 🛑 Stopping the containerized services"
      - >-
        docker compose
        --env-file core.env
        -f deploy/compose/services/docker-compose.yml
        down
      - task: down-infra

  migrate:all:up:
    desc: "Applies every migration of every service (goose from the host; up-* uses the migrator container)"
    cmds:
      - task migrate:order:up
      - task migrate:inventory:up
      - task migrate:iam:up

  # Internal goose wrapper: it takes the credentials from the same compose.env that starts
  # the database container and builds the connection string from POSTGRES_*.
  # A single source of truth, so goose and docker compose cannot drift apart.
  goose:exec:
    internal: true
    deps: [goose:install]
    dotenv: ['deploy/compose/{{.SVC}}/compose.env']
    requires:
      vars: [SVC, GOOSE_CMD]
    cmds:
      # POSTGRES_PORT is the host port from the compose mapping, so goose talks to localhost.
      - '{{.GOOSE}} -dir migrations/{{.SVC}} postgres "postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:$POSTGRES_PORT/$POSTGRES_DB?sslmode=disable" {{.GOOSE_CMD}}'

  # Creating a migration file does not touch the database: only the migrations/<svc> directory is needed.
  goose:create:
    internal: true
    deps: [goose:install]
    requires:
      vars: [SVC]
    cmds:
      - |
        name="{{.CLI_ARGS}}"
        if [ -z "$name" ]; then
          printf "Enter the migration name: "; read name;
        fi
        mkdir -p "migrations/{{.SVC}}"
        {{.GOOSE}} -dir "migrations/{{.SVC}}" create "$name" sql

  migrate:order:up:
    desc: "Applies every Order service migration"
    cmds:
      - task: goose:exec
        vars: { SVC: order, GOOSE_CMD: up }

  migrate:order:down:
    desc: "Rolls back the last Order service migration"
    cmds:
      - task: goose:exec
        vars: { SVC: order, GOOSE_CMD: down }

  migrate:order:status:
    desc: "Shows the Order service migration status"
    cmds:
      - task: goose:exec
        vars: { SVC: order, GOOSE_CMD: status }

  migrate:order:create:
    desc: "Creates a new Order service migration file (task migrate:order:create -- <name>)"
    cmds:
      - task: goose:create
        vars: { SVC: order }

  migrate:inventory:up:
    desc: "Applies every Inventory service migration"
    cmds:
      - task: goose:exec
        vars: { SVC: inventory, GOOSE_CMD: up }

  migrate:inventory:down:
    desc: "Rolls back the last Inventory service migration"
    cmds:
      - task: goose:exec
        vars: { SVC: inventory, GOOSE_CMD: down }

  migrate:inventory:status:
    desc: "Shows the Inventory service migration status"
    cmds:
      - task: goose:exec
        vars: { SVC: inventory, GOOSE_CMD: status }

  migrate:inventory:create:
    desc: "Creates a new Inventory service migration file (task migrate:inventory:create -- <name>)"
    cmds:
      - task: goose:create
        vars: { SVC: inventory }

  up-iam:
    desc: "Starts the IAM service with every dependency (PostgreSQL + Redis + migrations)"
    dir: deploy/compose/iam
    cmds:
      - echo "[task] 🔐 Starting IAM with its dependencies (PostgreSQL + Redis)"
      # First --wait brings postgres/redis up to healthy, then `run --rm` runs the one-shot
      # migrator and returns its exit code (see the explanation in up-order).
      # --progress plain and -T come from there too: compose must not hijack the terminal.
      - docker compose --progress plain --env-file ../../../core.env --env-file compose.env up --detach --wait postgres-iam redis-iam
      - docker compose --progress plain --env-file ../../../core.env --env-file compose.env run --rm -T --build migrator-iam

  down-iam:
    desc: "Stops and removes the IAM service with every dependency"
    dir: deploy/compose/iam
    cmds:
      - echo "[task] 🛑 Stopping IAM with its dependencies"
      - docker compose --env-file ../../../core.env --env-file compose.env down --volumes

  migrate:iam:up:
    desc: "Applies every IAM service migration"
    cmds:
      - task: goose:exec
        vars: { SVC: iam, GOOSE_CMD: up }

  migrate:iam:down:
    desc: "Rolls back the last IAM service migration"
    cmds:
      - task: goose:exec
        vars: { SVC: iam, GOOSE_CMD: down }

  migrate:iam:status:
    desc: "Shows the IAM service migration status"
    cmds:
      - task: goose:exec
        vars: { SVC: iam, GOOSE_CMD: status }

  migrate:iam:create:
    desc: "Creates a new IAM service migration file (task migrate:iam:create -- <name>)"
    cmds:
      - task: goose:create
        vars: { SVC: iam }

  test:api:
    desc: "Runs the API tests"
    cmds:
      - go test -tags=apitest -v -count=1 ./iam/tests/...
      - go test -tags=apitest -v -count=1 ./inventory/tests/...
      - go test -tags=apitest -v -count=1 ./order/tests/...

  test:e2e:
    desc: "Runs the order e2e tests against a real Kafka (Redpanda) via testcontainers"
    dir: order
    cmds:
      - echo '🚀 e2e order (Postgres + Redpanda via testcontainers)...'
      - go test -tags=e2e -count=1 -timeout=300s -v ./tests/e2e/...

  es:wait:
    silent: true # do not echo the script itself: in parallel output it turns into noise
    desc: "Waits for Elasticsearch to become ready"
    cmds:
      - echo "⏳ Waiting for Elasticsearch..."
      - |
        for i in $(seq 1 60); do
          curl -sSf {{.ELASTICSEARCH_URL}}/_cluster/health >/dev/null 2>&1 && break
          sleep 2
        done

  es:create-template:
    silent: true # do not echo the script itself: in parallel output it turns into noise
    desc: "Creates the index template for the otel-logs data stream (required in the exporter ECS mode)"
    cmds:
      # The OTel Collector sends logs with require_data_stream=true. Elasticsearch does NOT
      # create a data stream without an index template and answers index_not_found_exception,
      # so every log is lost. The template makes otel-logs* auto-create as a data stream.
      # number_of_replicas=0 because the cluster has a single node; otherwise the index stays yellow.
      - echo "📝 Creating the index template otel-logs-template (data stream)..."
      - |
        curl -sS -X PUT {{.ELASTICSEARCH_URL}}/_index_template/otel-logs-template \
          -H "Content-Type: application/json" \
          --data '{"index_patterns":["otel-logs*"],"data_stream":{},"priority":500,"template":{"settings":{"number_of_replicas":0}}}'
        echo ""
        echo "✅ Index template otel-logs-template created"

  es:init:
    desc: "Waits for Elasticsearch and creates the data stream index template"
    cmds:
      - task: es:wait
      - task: es:create-template

  kibana:wait:
    silent: true # do not echo the script itself: in parallel output it turns into noise
    desc: "Waits for Kibana to become ready"
    cmds:
      - echo '⏳ Waiting for Kibana...'
      - |
        # Wait for overall.level == available rather than just a response from /api/status.
        # Kibana starts answering before its plugins are up, and in that window
        # POST /api/data_views fails, which made kibana:create-view fail with an empty
        # data view id.
        for i in $(seq 1 90); do
          level=$(curl -sf -m 5 {{.KIBANA_URL}}/api/status 2>/dev/null \
            | jq -r '.status.overall.level // empty' 2>/dev/null)
          [ "$level" = "available" ] && break
          sleep 2
        done
        if [ "$level" != "available" ]; then
          echo "❌ Kibana did not become available within 180 seconds (last state: ${level:-no response})"
          exit 1
        fi
        echo '✅ Kibana is ready'

  kibana:create-view:
    silent: true # do not echo the script itself: in parallel output it turns into noise
    desc: "Creates the Kibana data view and makes it the default"
    cmds:
      - echo '📝 Creating the data view otel-logs*...'
      - |
        # Several attempts: even after overall.level=available there is a short window
        # where Kibana saved objects are not ready to accept writes yet.
        DATA_VIEW_ID=""
        for i in 1 2 3 4 5; do
          RESPONSE=$(curl -sS -X POST {{.KIBANA_URL}}/api/data_views/data_view \
            -H "kbn-xsrf: true" \
            -H "Content-Type: application/json" \
            --data '{"data_view":{"title":"otel-logs*","name":"OTel Logs","timeFieldName":"@timestamp","allowNoIndex":true},"override":true}')
          DATA_VIEW_ID=$(echo "$RESPONSE" | jq -r ".data_view.id // empty" 2>/dev/null)
          [ -n "$DATA_VIEW_ID" ] && break
          sleep 3
        done

        if [ -z "$DATA_VIEW_ID" ]; then
          # Print the Kibana response: without it the failure looks like an empty id
          # and the cause cannot be told.
          echo '❌ Failed to create the data view. Kibana response:'
          echo "$RESPONSE"
          exit 1
        fi

        echo "Data View ID: $DATA_VIEW_ID"
        curl -sS -X POST {{.KIBANA_URL}}/api/data_views/default \
          -H "kbn-xsrf: true" \
          -H "Content-Type: application/json" \
          -d "{\"data_view_id\": \"$DATA_VIEW_ID\", \"force\": true}"
        echo '✅ Data view created and set as default'

  kibana:init:
    desc: "Waits for Kibana and creates the data view for browsing logs"
    cmds:
      - task: kibana:wait
      - task: kibana:create-view

  kafka:wait:
    silent: true # do not echo the script itself: in parallel output it turns into noise
    desc: "Waits for the Kafka broker to become ready"
    cmds:
      - echo '⏳ Waiting for Kafka...'
      - |
        for i in $(seq 1 60); do
          docker exec kafka kafka-topics --bootstrap-server kafka:{{.KAFKA_INTERNAL_PORT}} --list >/dev/null 2>&1 && break
          sleep 2
        done
        if ! docker exec kafka kafka-topics --bootstrap-server kafka:{{.KAFKA_INTERNAL_PORT}} --list >/dev/null 2>&1; then
          echo '❌ Kafka did not start within 120 seconds'
          exit 1
        fi
        echo '✅ Kafka is ready'

  kafka:create-topics:
    silent: true # do not echo the script itself: in parallel output it turns into noise
    desc: "Creates the order.paid and assembly.ship-assembled topics (idempotent)"
    cmds:
      # KAFKA_AUTO_CREATE_TOPICS_ENABLE=true is not enough on its own: auto-creation is
      # triggered by a metadata request and happens asynchronously, while the order-service
      # consumer that receives UNKNOWN_TOPIC_OR_PARTITION brings the whole application down
      # (order/internal/app/app.go:71). The services have no restart policy, so the container
      # stays dead. down-core stops Kafka with --volumes, so the topics have to be created
      # on every startup.
      #
      # 3 partitions so that all three order-service replicas of one consumer group take a
      # partition each and read in parallel instead of idling.
      - echo '📝 Creating the Kafka topics...'
      - |
        set -e
        for topic in order.paid assembly.ship-assembled; do
          docker exec kafka kafka-topics --bootstrap-server kafka:{{.KAFKA_INTERNAL_PORT}} \
            --create --if-not-exists --topic "$topic" --partitions 3 --replication-factor 1
        done
        echo '✅ Topics ready:'
        docker exec kafka kafka-topics --bootstrap-server kafka:{{.KAFKA_INTERNAL_PORT}} --list

  kafka:init:
    desc: "Waits for Kafka and creates the topics the services need"
    cmds:
      - task: kafka:wait
      - task: kafka:create-topics

  jaeger:wait:
    silent: true # do not echo the script itself: in parallel output it turns into noise
    desc: "Waits for Jaeger to become ready (span ingestion and UI)"
    cmds:
      # Traces need no init of their own: Jaeger records services and operations itself,
      # nothing has to be created. But up-* must not finish before Jaeger starts answering,
      # otherwise the UI on localhost:16686 greets you with nothing.
      - echo '⏳ Waiting for Jaeger...'
      - |
        for i in $(seq 1 60); do
          curl -sSf {{.JAEGER_URL}}/api/services >/dev/null 2>&1 && break
          sleep 2
        done
        if ! curl -sSf {{.JAEGER_URL}}/api/services >/dev/null 2>&1; then
          echo '❌ Jaeger did not start within 120 seconds ({{.JAEGER_URL}})'
          exit 1
        fi
        echo '✅ Jaeger is ready'

  # A single initialization step for the whole observability stack, called from up-core,
  # so it runs in both up-infra and up-all. Nothing has to be started by hand after up-*:
  # logs in Kibana and traces in Jaeger are available right away.
  observability:init:
    desc: "Prepares observability: the ES index template and the Jaeger wait"
    cmds:
      # kibana:init is deliberately not part of this: Kibana takes ~40 seconds to start and
      # waiting for it here would put that time on the critical path of up-*. Instead it is
      # awaited as the last step of up-infra / up-all, when everything else is already up and
      # Kibana has warmed up in parallel.
      - task: es:init
      - task: jaeger:wait

  vegeta:install:
    desc: "Installs vegeta (HTTP load testing)"
    cmds:
      - GOBIN={{.BIN_DIR}} go install github.com/tsenart/vegeta/v12@{{.VEGETA_VERSION}}
    status:
      - test -x {{.VEGETA}}

  # Prepares the parts for the load test: creates them when missing and resets their state.
  #
  # Every successful Create reserves one unit of each part (available = stock_quantity -
  # reserved) and the reservation is never released. Without a reset the second run starts
  # with a partially consumed stock and the Nth run hits the ceiling: order-service starts
  # answering 409, orders_created stops growing and the Grafana panel flatlines at zero.
  #
  # This lives here rather than in migrations/inventory because it is a load test fixture,
  # not part of the schema: a migration would carry it into every environment, production
  # included, and changing the stock would need a new migration. ON CONFLICT makes the task
  # idempotent: it repairs the state on any database, no matter how many runs happened
  # before it.
  #
  # The parts are dedicated (10ad7e57-… reads as "loadtest"); the seeded ones (550e8400-…)
  # are left alone because the API and e2e tests depend on their stock and reservations.
  # A hull with strength=200 and a class C engine (required_strength=30) is a pair that
  # always passes ValidateCompatibility, so no order is rejected as incompatible.
  #
  # There are LOAD_PAIRS pairs rather than one: Reserve takes SELECT ... FOR UPDATE on the
  # part rows, so every order for the same pair queues on two rows and the test measures
  # the cost of the lock rather than the service. With several pairs (load:http rotates
  # over them) the queue breaks up into independent ones.
  load:seed:
    silent: true # do not echo the script itself: in parallel output it turns into noise
    desc: "Creates and replenishes the load test parts (called from load:http)"
    cmds:
      - |
        set -e
        # Without set -e a non-zero psql exit code is masked by the final echo and the task
        # silently reports success on an unreset stock.

        if ! docker ps --format '{{`{{.Names}}`}}' | grep -qx 'postgres-inventory'; then
          echo '❌ The postgres-inventory container is not running (task up-all is required)'
          exit 1
        fi

        # Credentials come from the container environment itself (env_file: compose.env), to
        # avoid duplicating them in the Taskfile. The SQL goes through stdin (docker exec -i),
        # otherwise the quotes of the SQL literals would need '"'"' escaping.
        # The pair UUIDs are built deterministically so that load:http assembles the same ones:
        #   hull   10ad7e57-0000-4000-8000-1000000000NN
        #   engine 10ad7e57-0000-4000-8000-2000000000NN
        docker exec -i postgres-inventory sh -c \
          'psql -q -v ON_ERROR_STOP=1 -v pairs={{.LOAD_PAIRS}} -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
        INSERT INTO parts (uuid, name, description, part_type, price, stock_quantity, properties)
        SELECT ('10ad7e57-0000-4000-8000-1000000000' || lpad(i::text, 2, '0'))::uuid,
               'Load test hull #' || i,
               'Hull for the load test (task load:http)',
               'HULL', 100000, 1000000, '{"hull": {"strength": 200}}'::jsonb
          FROM generate_series(1, :pairs) AS i
        UNION ALL
        SELECT ('10ad7e57-0000-4000-8000-2000000000' || lpad(i::text, 2, '0'))::uuid,
               'Load test engine #' || i,
               'Engine for the load test (task load:http)',
               'ENGINE', 100000, 1000000, '{"engine": {"class": "C", "required_strength": 30}}'::jsonb
          FROM generate_series(1, :pairs) AS i
        ON CONFLICT (uuid) DO UPDATE
          SET stock_quantity = EXCLUDED.stock_quantity,
              properties     = EXCLUDED.properties,
              reserved       = 0;
        SQL
        echo '📦 Load test parts ready (1 000 000 units, reservations reset)'

  # HTTP load test: stepped growth from 50 to 500 RPS over 2.5 minutes.
  # Run task up-all in one terminal and task load:http in another.
  # The results are visible in Grafana (localhost:3000).
  load:http:
    desc: "HTTP load test: POST with growing load (50 to 500 RPS over 2.5 minutes)"
    deps: [vegeta:install, buf:install]
    cmds:
      - task: load:seed
      - |
        VEGETA="{{.VEGETA}}"
        RESULTS_DIR=$(mktemp -d)
        TARGETS_FILE="$RESULTS_DIR/targets.txt"
        trap 'rm -rf "$RESULTS_DIR"' EXIT

        # Register a dedicated user and log in: /api/v1/orders is guarded by the auth
        # middleware, and without an Authorization header the test would only measure 401s.
        LOGIN="load-test-$(date +%s)"
        {{.BUF}} curl --schema shared/proto --protocol grpc --http2-prior-knowledge \
          -d "{\"info\":{\"info\":{\"login\":\"$LOGIN\"},\"password\":\"LoadTest123!\"}}" \
          http://localhost:50053/user.v1.UserService/Register >/dev/null
        SESSION=$({{.BUF}} curl --schema shared/proto --protocol grpc --http2-prior-knowledge \
          -d "{\"login\":\"$LOGIN\",\"password\":\"LoadTest123!\"}" \
          http://localhost:50053/auth.v1.AuthService/Login | jq -r '.sessionUuid')
        if [ -z "$SESSION" ] || [ "$SESSION" = "null" ]; then
          echo '❌ Could not obtain a session from IAM (are the services up? task up-all)'
          exit 1
        fi
        echo "🔑 Session obtained for $LOGIN"

        # One target per part pair from load:seed — vegeta walks the targets file in a loop,
        # so the orders spread evenly across the pairs.
        # A single pair for the whole test would queue every order on two rows in
        # SELECT ... FOR UPDATE (see Reserve in inventory), and the test would measure the
        # cost of the lock rather than the throughput of the service.
        # The UUIDs follow the same scheme as in load:seed.
        : > "$TARGETS_FILE"
        for i in $(seq 1 {{.LOAD_PAIRS}}); do
          idx=$(printf '%02d' "$i")
          printf '{"hull_uuid":"10ad7e57-0000-4000-8000-1000000000%s","engine_uuid":"10ad7e57-0000-4000-8000-2000000000%s"}\n' \
            "$idx" "$idx" > "$RESULTS_DIR/body-$idx.json"
          printf 'POST http://localhost:8080/api/v1/orders\n@%s\n\n' \
            "$RESULTS_DIR/body-$idx.json" >> "$TARGETS_FILE"
        done
        echo "🎯 Targets in rotation - {{.LOAD_PAIRS}}, one part pair each"

        # Expected picture: some requests answer 201, some 429 from the rate limiter
        # (rate_limit in config.docker.yaml). There must be no 409: the stock of the load
        # test parts (1 000 000) cannot be exhausted even if all ~41 000 requests of the run
        # succeed, and load:seed cleared the reservations of previous runs.
        for rate in 50 100 150 200 250 300 350 400 450 500; do
          echo "⏱️  step - ${rate} RPS for 15 seconds"
          $VEGETA attack -targets="$TARGETS_FILE" -rate="${rate}/s" -duration=15s \
              -header="Content-Type: application/json" \
              -header="Authorization: Bearer $SESSION" | \
            $VEGETA encode --to json >> "$RESULTS_DIR/results.json"
        done

        $VEGETA report -type=json < "$RESULTS_DIR/results.json"
