version: "2"  # Config file format version (v2 for golangci-lint 2.x)

run: # Linter run settings
  timeout: 5m  # Maximum analysis time
  relative-path-mode: gomod  # File paths are relative to the Go module root
  issues-exit-code: 1  # Exit code 1 when issues are found (useful in CI)
  tests: true  # Analyse _test.go files as well
  modules-download-mode: readonly  # Do not download dependencies during analysis (safer and faster in CI)

output: # How the results are reported
  formats:
    text: # Terminal output format
      print-linter-name: true  # Show the linter name next to every message
      print-issued-lines: true  # Show the offending source line
      colors: true  # Colourize the output for readability

issues: # General issue handling
  max-issues-per-linter: 0  # No cap on issues from a single linter
  max-same-issues: 0  # No cap on identical issues
  uniq-by-line: true  # At most one issue per line (avoids spam from several linters on one line)
  exclude-dirs:
    - order/tests

linters: # Enabled and disabled linters
  default: standard  # The standard golangci-lint set (errcheck, govet, staticcheck, ineffassign, unused)
  enable: # Additional linters enabled explicitly
    # Code quality
    - gocritic        # Advanced rules that improve code quality
    - revive          # Style, formatting and naming checks
    - gosec           # Vulnerabilities and unsafe practices
    - depguard        # Forbids importing the listed packages (dependency control)
    - bodyclose       # Checks that `resp.Body` is closed for HTTP requests
    - noctx           # Checks that HTTP requests carry a context.Context
    - containedctx    # Warns when a `context.Context` is stored in a struct

    # Complexity and size
    - cyclop          # Caps cyclomatic complexity
    - gocognit        # Caps cognitive complexity
    - funlen          # Caps function length
    - nakedret        # Forbids naked returns in long functions

    # Errors
    - errorlint       # Recommends `errors.Is` / `errors.As` over direct comparisons
    - errname         # Checks error variable and type names (they must contain "Err")

    # Performance
    - perfsprint      # Replaces slow fmt.Sprintf calls with faster alternatives
    - prealloc        # Finds slices that could be pre-allocated

    # Modern Go (1.22+)
    - copyloopvar     # Detects needless copying of loop variables
    - intrange        # Suggests for i := range n
    - exptostd        # Replaces golang.org/x/exp with the standard library

    # Style and formatting
    - asciicheck      # Warns about non-ASCII characters in code
    - dupl            # Finds duplicated code fragments
    - unparam         # Finds unused function parameters
    - forbidigo       # Forbids calls or constructs matching regex patterns
    - usestdlibvars   # Suggests the standard constants (http.MethodGet and friends)
    - mirror          # Finds misuse of the bytes/strings functions
    - godot           # Checks that comments end with a period
    - nolintlint      # Validates //nolint directives
    - godox           # Finds TODO, FIXME, BUG and HACK comments

    # Tests
    - testifylint     # Extra checks for testify

    # Logging
    - sloglint        # Checks for slog (structured logging)

  disable: # Linters disabled on purpose
    - gocyclo       # The old complexity linter, superseded by cyclop
    - lll           # Line length checks, superseded by the golines formatter
    - contextcheck  # Too many false positives
    - err113        # Too strict
    - varnamelen    # Too many false positives
    - nlreturn      # Debatable formatting
    - wsl           # Deprecated, superseded by wsl_v5
    - wrapcheck     # Overly strict for educational code

  exclusions: # Analysis exclusions
    generated: strict  # Skip generated files (marked "// Code generated ... DO NOT EDIT.")
    presets: # Standard exclusions for common cases
      - std-error-handling      # Skips errors such as os.Close that are commonly ignored
      - common-false-positives  # Skips known false positives (gosec G304, for example)
    rules: # Local exclusions by path, file or linter
      - path: _test\.go  # For every test:
        linters:
          - cyclop      # do not check cyclomatic complexity in tests
          - gocognit    # do not check cognitive complexity in tests
          - dupl        # do not report duplication in tests
          - gosec       # do not look for vulnerabilities in tests
          - funlen      # do not check test function length
          - wrapcheck   # do not require error wrapping in tests
          - noctx       # do not require a context in test HTTP requests
          - containedctx  # allow context.Context inside test suite structs
          - testifylint   # do not apply the strict testify rules in tests
          - unparam       # do not report unused parameters in tests
    paths:
      - order/tests/.* # Exclude the functional test directory from analysis

  settings: # Per-linter settings

    gosec:
      # Enable every rule, including the experimental ones
      config:
        global:
          audit: true        # Turn on every security rule
          show-ignored: true # Report issues ignored through comments
        severity: "medium"   # Minimum severity: high/medium/low
        confidence: "medium" # Minimum confidence: high/medium/low
      excludes:
        # G704 (SSRF) and G706 (log injection) rely on taint analysis, a static data-flow
        # analysis. The problem is that taint analysis CANNOT see that the data was
        # sanitized by a function call (sanitize() or url.JoinPath(), for example), so gosec
        # keeps treating correctly handled data as tainted.
        # Safety is enforced in the code itself: stripping newlines from strings before logging
        # building URLs through net/url to prevent SSRF.
        - G704  # SSRF via taint analysis — false positives when net/url is used
        - G706  # Log injection via taint analysis — false positives after sanitization

    cyclop:
      max-complexity: 20  # Allowed cyclomatic complexity of a function

    gocognit:
      min-complexity: 20  # Allowed cognitive complexity of a function (10-20 is recommended)

    funlen:
      lines: 100       # Maximum lines per function
      statements: 50   # Maximum statements per function

    nakedret:
      max-func-lines: 30  # Forbid naked returns in functions longer than 30 lines

    depguard:
      rules:
        main:
          deny:
            - pkg: io/ioutil
              desc: "Deprecated package - use os/io"
            - pkg: github.com/golang/protobuf
              desc: "Use google.golang.org/protobuf"
            - pkg: github.com/satori/go.uuid
              desc: "Use github.com/google/uuid"
            - pkg: math/rand$
              desc: "Use math/rand/v2"
            - pkg: log$
              desc: "Use log/slog for structured logging"
            - pkg: github.com/pkg/errors
              desc: "Use the standard errors package and fmt.Errorf with %w"

    revive:
      severity: warning  # revive findings are warnings rather than errors

    perfsprint:
      int-conversion: true   # Check int conversions
      err-error: true        # Check err.Error()
      errorf: true           # Check fmt.Errorf
      sprintf1: true         # Check single-argument fmt.Sprintf

    nolintlint:
      require-explanation: true  # Require an explanation for //nolint
      require-specific: true     # Require naming the specific linter

    godot:
      scope: toplevel  # Only check top-level comments
      period: true     # Require a trailing period

    forbidigo:
      exclude-godoc-examples: true  # Do not apply the bans to Godoc examples
      analyze-types: true  # Look for banned patterns in types and constants too, not only functions
      forbid: # Banned patterns
        - pattern: '^fmt\.Print.*$'  # Ban fmt.Print*, fmt.Println and friends
          msg: "Do not use fmt.Print* for logging; use the structured logger instead"
        - pattern: '^time\.Sleep$'  # Ban time.Sleep
          msg: "Do not use time.Sleep in production code; use timers or contexts"
        - pattern: '^http\.DefaultClient$'  # Ban the unsafe http.DefaultClient
          msg: "Do not use http.DefaultClient (it has no timeouts); build an *http.Client with timeouts"

    godox:
      keywords:  # Which keywords to look for in comments
        - TODO   # Work that still has to be done
        - FIXME  # Bugs that have to be fixed
        - BUG    # Known bugs
        - HACK   # Workarounds that should be reworked

formatters: # Code formatters (style checks)
  enable:
    - gofumpt  # A stricter gofmt with extra rules
    - gci      # Import formatter (a flexible alternative to goimports)
  settings:
    gofumpt:
      extra-rules: true  # Enable the extra strict rules (removing redundant blank lines, for example)
    gci:
      sections: # Import grouping order
        - Standard  # Standard library
        - Default   # Third-party dependencies
        - Prefix(github.com/vixart/rocket-factory)  # Project-local imports
      no-inline-comments: false  # Allow comments after imports (true would forbid them)
