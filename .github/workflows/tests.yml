name: Tests

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Task
        uses: arduino/setup-task@v2

      - name: Download dependencies
        run: |
          for mod in order inventory payment; do
            cd "$mod"
            go mod download
            cd ..
          done

      - name: Run tests
        run: task test

      - name: Run coverage
        run: task test:coverage