name: Go Task Cache

on:
  workflow_call:
    inputs:
      go-version:
        required: true
        type: string

jobs:
  build:
    name: Cache go-task binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Create bin directory
        run: mkdir -p ./bin

      - name: Cache go-task binary
        id: cache-task
        uses: actions/cache@v4
        with:
          path: ./bin/go-task
          key: ${{ runner.os }}-go-task-v3.37.2

      - name: Download go-task if not cached
        if: steps.cache-task.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o ./bin/task.tar.gz https://github.com/go-task/task/releases/download/v3.37.2/task_linux_amd64.tar.gz
          tar -xzf ./bin/task.tar.gz -C ./bin
          mv ./bin/task ./bin/go-task
          rm ./bin/task.tar.gz
          chmod +x ./bin/go-task

      - name: Test go-task installation
        run: ./bin/go-task --version
