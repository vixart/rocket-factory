env:
  app_env: "docker"
  service_name: "iam-service"
  service_version: "1.0.0"

grpc:
  host: "0.0.0.0"
  port: "50053"

logger:
  level: "info"

pg:
  host: "postgres-iam"
  port: "5432"
  database: "iam-service"
  user: "iam-service-user"
  password: "iam-service-password"
  sslmode: "disable"

redis:
  host: "redis-iam"
  port: "6379"
  connection_timeout: "10s"
  max_idle: 10
  idle_timeout: "10s"
  cache_ttl: "1h"

session:
  ttl: "24h"

otel:
  endpoint: "otel-collector:4317"
  enable_otlp: true
  sampling_ratio: 1.0
