# Telemetry pipeline (all three signals through one collector):
#   Traces:  Go App → OTLP receiver → memory_limiter + resource + sampler + batch → Jaeger (OTLP)
#   Metrics: Go App → OTLP receiver → memory_limiter + resource + batch → Prometheus (remote write)
#   Logs:    Go App → OTLP receiver → memory_limiter + resource + transform + batch → Elasticsearch
#
# A single collector handles all three telemetry types (traces, metrics, logs).
# Each type has its own pipeline with the processors and exporter it needs.

# receivers — where the collector receives telemetry from.
# One receiver serves all three pipelines at once.
receivers:
  # OTLP (OpenTelemetry Protocol) is the standard telemetry transport.
  # Applications connect through the SDK and send every signal here.
  otlp:
    protocols:
      grpc:
        # 0.0.0.0 — listen on every network interface (required in Docker).
        # 4317 is the standard OTLP gRPC port (4318 is OTLP HTTP).
        endpoint: 0.0.0.0:4317

# processors — what happens to the data between receiving and exporting.
# Order matters: data flows through the processors sequentially.
# The same processor can be used by several pipelines.
processors:
  # Caps the collector memory usage, protecting it from OOM during load spikes.
  # It must be the FIRST processor in every pipeline so that data is dropped before it
  # reaches the other processors and takes up even more memory.
  memory_limiter:
    check_interval: 1s    # how often memory usage is checked
    limit_mib: 256        # hard memory limit; data is dropped above it
                          # MiB = 1024² bytes, unlike MB = 1000² bytes
    spike_limit_mib: 64   # spike allowance between checks

  # Resource processor — adds resource attributes to every signal (traces, metrics, logs).
  # Resource attributes describe the telemetry source (service, environment, region) and
  # make the data filterable and groupable in Jaeger, Grafana and Kibana.
  resource:
    attributes:
      - key: deployment.environment
        value: dev
        action: insert      # insert — only add when the application has not set it

  # Batch processor — groups data into batches before exporting.
  # It reduces the number of network requests and raises throughput.
  # It must be the LAST processor: filter and enrich first, batch afterwards.
  batch:
    send_batch_size: 1000   # flush once N items pile up (default 8192)
    timeout: 5s             # or on timeout if the batch is not full (default 200ms)

  # Probabilistic (head-based) trace sampling.
  # The keep/drop decision is made from the TraceID, so every span of a trace
  # is guaranteed to end up in the same group.
  # 100% keeps every trace (development); production usually runs 1-10%.
  probabilistic_sampler:
    sampling_percentage: 100

  # Transform processor — rewrites telemetry with OTTL expressions.
  # (OpenTelemetry Transformation Language).
  # Here it sets the ECS (Elastic Common Schema) mapping mode, the standard Elasticsearch
  # data schema that keeps Kibana dashboards compatible.
  transform:
    log_statements:
      - context: scope      # the scope context — instrumentation (library/module) attributes
        statements:
          - set(attributes["elastic.mapping.mode"], "ecs")

# exporters — where the collector sends the processed data.
# Each exporter belongs to its own pipeline.
exporters:
  # Jaeger accepts OTLP gRPC on port 4317 (natively since Jaeger v2).
  # The otlp/<name> form allows several exporters of the same type with different
  # settings (otlp/jaeger and otlp/tempo, for example).
  otlp/jaeger:
    endpoint: jaeger:4317   # host name inside the Docker Compose network
    tls:
      insecure: true        # no TLS — acceptable for local development

  # Prometheus remote write — a push delivery model.
  # The collector pushes metrics to Prometheus instead of waiting to be scraped.
  prometheusremotewrite:
    endpoint: "http://prometheus:9090/api/v1/write"   # Remote Write API endpoint
    tls:
      insecure: true

  # Elasticsearch exporter — ships logs to Elasticsearch over HTTP.
  # They are indexed into the configured index and searchable in Kibana.
  elasticsearch:
    endpoints: ["http://elasticsearch:9200"]
    tls:
      insecure: true
    logs_index: "otel-logs"   # Elasticsearch index for the logs

# extensions — collector capabilities unrelated to the pipelines.
extensions:
  # Health check endpoint — lets Docker/Kubernetes probe the collector.
  health_check:
    endpoint: 0.0.0.0:13133  # GET http://localhost:13133/ → 200 OK

# service — ties everything together: which extensions to enable
# and how receivers → processors → exporters are wired into pipelines.
service:
  # The collector's own telemetry: its metrics, for monitoring it.
  telemetry:
    metrics:
      level: basic          # basic — core collector metrics (processed/dropped)

  extensions: [health_check]

  # Three pipelines, one per telemetry type.
  # The common processor order:
  #   1. memory_limiter — OOM protection (always first!)
  #   2. resource — enrichment with environment attributes
  #   3. [signal specific] — sampling (traces) or transformation (logs)
  #   4. batch — grouping before export (always last!)
  pipelines:
    # Traces → Jaeger
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, probabilistic_sampler, batch]
      exporters: [otlp/jaeger]

    # Metrics → Prometheus
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheusremotewrite]

    # Logs → Elasticsearch → Kibana
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, transform, batch]
      exporters: [elasticsearch]
