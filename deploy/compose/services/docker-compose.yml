# Docker Compose for every microservice.
# Run it with: task up-all (which includes --scale order-service=3)

services:

  # --- HTTP service (scaled with --scale) ---

  order-service:
    build:
      context: ../../..
      dockerfile: deploy/dockerfiles/order.Dockerfile
      args:
        GO_IMAGE: ${GO_IMAGE}
        ALPINE_IMAGE: ${ALPINE_IMAGE}
    # No container_name: with --scale Docker assigns unique names.
    # No ports: traffic goes through Nginx rather than directly.
    volumes:
      - ../../../order/config.docker.yaml:/config.yaml
    environment:
      - CONFIG_PATH=/config.yaml
    # Override layer on top of config.docker.yaml (cleanenv: env > yaml).
    env_file:
      - ../../../order/order.docker.env
    networks:
      - microservices-net

  # --- Nginx Load Balancer ---

  nginx:
    image: ${NGINX_IMAGE}
    container_name: nginx
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - order-service
    networks:
      - microservices-net

  # --- gRPC services ---
  # The gRPC services have no container_name either, which makes them scalable with
  # --scale (handy for experiments). Docker DNS still resolves the service name to the
  # IPs of every replica. To debug by container name use docker ps (the real names look
  # like services-inventory-service-1).

  inventory-service:
    build:
      context: ../../..
      dockerfile: deploy/dockerfiles/inventory.Dockerfile
      args:
        GO_IMAGE: ${GO_IMAGE}
        ALPINE_IMAGE: ${ALPINE_IMAGE}
    ports:
      - "50051:50051"
    volumes:
      - ../../../inventory/config.docker.yaml:/config.yaml
    environment:
      - CONFIG_PATH=/config.yaml
    # Override layer on top of config.docker.yaml (cleanenv: env > yaml).
    env_file:
      - ../../../inventory/inventory.docker.env
    networks:
      - microservices-net

  payment-service:
    build:
      context: ../../..
      dockerfile: deploy/dockerfiles/payment.Dockerfile
      args:
        GO_IMAGE: ${GO_IMAGE}
        ALPINE_IMAGE: ${ALPINE_IMAGE}
    ports:
      - "50052:50052"
    volumes:
      - ../../../payment/config.docker.yaml:/config.yaml
    environment:
      - CONFIG_PATH=/config.yaml
    # Override layer on top of config.docker.yaml (cleanenv: env > yaml).
    env_file:
      - ../../../payment/payment.docker.env
    networks:
      - microservices-net

  iam-service:
    build:
      context: ../../..
      dockerfile: deploy/dockerfiles/iam.Dockerfile
      args:
        GO_IMAGE: ${GO_IMAGE}
        ALPINE_IMAGE: ${ALPINE_IMAGE}
    ports:
      - "50053:50053"
    volumes:
      - ../../../iam/config.docker.yaml:/config.yaml
    environment:
      - CONFIG_PATH=/config.yaml
    # Override layer on top of config.docker.yaml (cleanenv: env > yaml).
    env_file:
      - ../../../iam/iam.docker.env
    networks:
      - microservices-net

  # --- Kafka consumers ---

  assembly-service:
    build:
      context: ../../..
      dockerfile: deploy/dockerfiles/assembly.Dockerfile
      args:
        GO_IMAGE: ${GO_IMAGE}
        ALPINE_IMAGE: ${ALPINE_IMAGE}
    volumes:
      - ../../../assembly/config.docker.yaml:/config.yaml
    environment:
      - CONFIG_PATH=/config.yaml
    # Override layer on top of config.docker.yaml (cleanenv: env > yaml).
    env_file:
      - ../../../assembly/assembly.docker.env
    networks:
      - microservices-net

networks:
  microservices-net:
    name: microservices-net
    external: true
