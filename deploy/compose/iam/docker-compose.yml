services: # Containers required by the IAM service

  postgres-iam: # PostgreSQL container holding the IAM user data
    image: ${POSTGRES_IMAGE} # The official Alpine-based PostgreSQL image: small and fast
    container_name: postgres-iam # A readable container name, convenient while debugging and in the CLI

    env_file:
      - compose.env
      # POSTGRES_DB/USER/PASSWORD for the database container (see compose.env next to it),

    volumes:
      - postgres_iam_data:/var/lib/postgresql
      # A named volume keeps the database data outside the container,
      # so nothing is lost when the container restarts

    ports:
      - "${POSTGRES_PORT}:5432"
      # Publish the internal PostgreSQL port (5432) on the host port from POSTGRES_PORT,
      # so the database can be reached from outside, from DBeaver or another service

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      # Readiness probe: pg_isready with the login from .env.
      # The interval is small because `up --wait` in the up-iam task waits on this probe,
      # and with interval=10s the first check happens 10 seconds after start even though
      # postgres is ready in 1-2 seconds.
      interval: 2s # Check every 2 seconds
      timeout: 3s # Timeout of a single probe
      retries: 15 # After 15 consecutive failures the service counts as unhealthy
      start_period: 5s # Failures during database initialization do not count

    restart: unless-stopped
    # Restart automatically on failure, but not after a manual stop

    networks:
      - microservices-net
      # Join the shared network where all microservices live

  redis-iam: # Redis — the IAM cache and session storage
    image: ${REDIS_IMAGE} # A small image of the latest stable Redis
    container_name: redis-iam # Explicit Redis container name

    ports:
      - "${REDIS_PORT}:6379"
      # Publish the internal Redis port on the external one from .env,
      # so the IAM service can reach Redis through the host port

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      # Probe: if Redis answers ping it is alive.
      # Redis is also part of `up --wait` in the up-iam task, hence the small interval:
      # it is ready almost instantly, so waiting 10 seconds for the first check is pointless.
      interval: 2s # Check Redis every 2 seconds
      timeout: 3s # Wait up to 3 seconds for a response
      retries: 15 # After 15 failed attempts the container counts as unhealthy

    restart: unless-stopped
    # Restart Redis after a failure, unless it was stopped manually

    networks:
      - microservices-net
      # Redis joins the same shared network as PostgreSQL and the other services

  migrator-iam: # One-shot goose container: applies the SQL migrations and exits with 0
    build:
      context: ../../..
      dockerfile: deploy/dockerfiles/migrator.Dockerfile
      args:
        # Image and goose versions come from core.env (a single source of truth)
        GO_IMAGE: ${GO_IMAGE}
        ALPINE_IMAGE: ${ALPINE_IMAGE}
        GOOSE_VERSION: ${GOOSE_VERSION}

    depends_on:
      postgres-iam:
        condition: service_healthy
        # Do not start the migrations until PostgreSQL passes its healthcheck

    volumes:
      - ../../../migrations/iam:/migrations:ro
      # Mount the SQL migrations into the container at /migrations

    command:
      # Inside the docker network the database is reachable at postgres-iam:5432 rather
      # than through the host port. Credentials come from POSTGRES_* (iam.env).
      - -dir
      - /migrations
      - postgres
      - postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-iam:5432/${POSTGRES_DB}?sslmode=disable
      - up

    networks:
      - microservices-net

volumes: # Volumes Docker creates and manages
  postgres_iam_data:
  # Volume with the PostgreSQL data (tables, indexes and so on),
  # preserved across container restarts

networks: # Network definition
  microservices-net:
    external: true
    # We do not create a network but join the external one shared by every microservice
    # It must be created beforehand: docker network create microservices-net
