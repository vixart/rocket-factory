services: # Здесь описываются контейнеры, необходимые для Inventory-сервиса

  postgres-inventory: # Контейнер с PostgreSQL — используется для хранения данных об инвентаре (детали, компоненты)
    image: ${POSTGRES_IMAGE}
    # Используем официальный образ PostgreSQL на базе Alpine Linux

    container_name: postgres-inventory
    # Устанавливаем удобное читаемое имя контейнера — пригодится для логов и отладки

    env_file:
      - compose.env
      # POSTGRES_DB/USER/PASSWORD для контейнера БД (см. compose.env рядом)
      # Это позволяет переиспользовать одни и те же переменные в docker-compose, Taskfile и тестах

    volumes:
      - postgres_inventory_data:/var/lib/postgresql
      # Подключаем локальный Docker-том к директории PostgreSQL, где хранятся все данные (таблицы, индексы и т.д.)
      # Это нужно для сохранения данных между перезапусками контейнера

    ports:
      - "${POSTGRES_PORT}:5432"
      # Пробрасываем внутренний порт PostgreSQL (5432) наружу на порт из inventory.env (POSTGRES_PORT=5433)
      # Порт 5433, чтобы не конфликтовать с PostgreSQL для OrderService (порт 5432)

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      # Проверка готовности PostgreSQL: выполняем pg_isready для проверки доступности базы
      # Интервал маленький, потому что на этой проверке ждёт `up --wait` в задаче
      # up-inventory: при interval=10s первая проверка происходит через 10 секунд
      # после старта, хотя postgres готов за 1–2 секунды, и эти секунды просто
      # добавляются к времени up-all.
      interval: 2s # Запускаем проверку каждые 2 секунды
      timeout: 3s # Максимальное время ожидания выполнения проверки
      retries: 15 # После 15 неудачных проверок подряд контейнер считается "неработоспособным"
      start_period: 5s # Пока идёт инициализация БД, неудачные проверки не считаются за отказ

    restart: unless-stopped
    # Автоматически перезапускаем контейнер, если он аварийно завершился
    # Но если мы остановим его вручную — он не запустится повторно

    networks:
      - microservices-net
      # Подключаем контейнер к общей сети всех микросервисов, чтобы они могли взаимодействовать между собой по имени

  migrator-inventory: # Одноразовый контейнер goose — накатывает SQL-миграции и завершается (exit 0)
    build:
      context: ../../..
      dockerfile: deploy/dockerfiles/migrator.Dockerfile
      args:
        # Версии образов и goose — из core.env (единый источник истины)
        GO_IMAGE: ${GO_IMAGE}
        ALPINE_IMAGE: ${ALPINE_IMAGE}
        GOOSE_VERSION: ${GOOSE_VERSION}

    depends_on:
      postgres-inventory:
        condition: service_healthy
        # Не стартуем миграции, пока PostgreSQL не пройдёт healthcheck

    volumes:
      - ../../../migrations/inventory:/migrations:ro
      # Монтируем SQL-миграции внутрь контейнера в /migrations

    command:
      # Внутри docker-сети база доступна по имени контейнера postgres-inventory:5432,
      # а не по хостовому порту. Креды берём из POSTGRES_* (интерполяция из inventory.env).
      - -dir
      - /migrations
      - postgres
      - postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-inventory:5432/${POSTGRES_DB}?sslmode=disable
      - up

    networks:
      - microservices-net

volumes: # Раздел с томами — определяем хранилище, которое создаст Docker
  postgres_inventory_data:
  # Именованный том, в котором будут храниться данные PostgreSQL для Inventory-сервиса
  # Он живёт отдельно от контейнера и сохраняется даже после удаления контейнера

networks: # Определение используемой сети
  microservices-net:
    external: true
    # Мы не создаём новую сеть, а подключаемся к внешней, общей для всех микросервисов
    # Её создаёт task up-core (docker network create microservices-net)
