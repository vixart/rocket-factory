services: # Containers required by the Inventory service

  postgres-inventory: # PostgreSQL container holding the inventory data (parts and components)
    image: ${POSTGRES_IMAGE}
    # The official Alpine-based PostgreSQL image: small and fast, it saves resources

    container_name: postgres-inventory
    # A readable container name, handy in logs and while debugging

    env_file:
      - compose.env
      # POSTGRES_DB/USER/PASSWORD for the database container (see compose.env next to it),
      # so the same variables are reused by compose, the Taskfile and the tests

    volumes:
      - postgres_inventory_data:/var/lib/postgresql
      # Mount a Docker volume onto the PostgreSQL data directory (tables, indexes and so on),
      # so the data survives container restarts

    ports:
      - "${POSTGRES_PORT}:5432"
      # Publish the internal PostgreSQL port (5432) on the port from inventory.env (POSTGRES_PORT=5433).
      # 5433 avoids clashing with the OrderService PostgreSQL on 5432

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      # Readiness probe: pg_isready checks that the database is reachable.
      # The interval is small because `up --wait` in the up-inventory task waits on this
      # probe: with interval=10s the first check happens 10 seconds after start even
      # though postgres is ready in 1-2 seconds, and those seconds are simply added to
      # the up-all time.
      interval: 2s # Run the probe every 2 seconds
      timeout: 3s # Maximum time to wait for a probe
      retries: 15 # After 15 consecutive failures the container counts as unhealthy
      start_period: 5s # Failures during database initialization do not count

    restart: unless-stopped
    # Restart the container automatically after a crash,
    # but not after a manual stop

    networks:
      - microservices-net
      # Join the shared microservices network so containers can reach each other by name

  migrator-inventory: # One-shot goose container: applies the SQL migrations and exits with 0
    build:
      context: ../../..
      dockerfile: deploy/dockerfiles/migrator.Dockerfile
      args:
        # Image and goose versions come from core.env (a single source of truth)
        GO_IMAGE: ${GO_IMAGE}
        ALPINE_IMAGE: ${ALPINE_IMAGE}
        GOOSE_VERSION: ${GOOSE_VERSION}

    depends_on:
      postgres-inventory:
        condition: service_healthy
        # Do not start the migrations until PostgreSQL passes its healthcheck

    volumes:
      - ../../../migrations/inventory:/migrations:ro
      # Mount the SQL migrations into the container at /migrations

    command:
      # Inside the docker network the database is reachable at postgres-inventory:5432
      # rather than through the host port. Credentials come from POSTGRES_* (inventory.env).
      - -dir
      - /migrations
      - postgres
      - postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-inventory:5432/${POSTGRES_DB}?sslmode=disable
      - up

    networks:
      - microservices-net

volumes: # Volumes Docker will create
  postgres_inventory_data:
  # Named volume with the PostgreSQL data of the Inventory service. It lives separately
  # from the container and survives even when the container is removed

networks: # Network definition
  microservices-net:
    external: true
    # We do not create a network but join the external one shared by every microservice
    # It is created by task up-core (docker network create microservices-net)
