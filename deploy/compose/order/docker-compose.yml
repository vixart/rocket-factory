services: # Containers required by the Order service

  postgres-order: # PostgreSQL container holding the order data
    image: ${POSTGRES_IMAGE}
    # The official Alpine-based PostgreSQL image: small and fast, it saves resources


    container_name: postgres-order
    # A unique container name makes it convenient to address in the CLI and while debugging

    env_file:
      - compose.env
      # POSTGRES_DB/USER/PASSWORD for the database container (see compose.env next to it),
      # so the same variables are reused by compose, the Taskfile and the tests

    volumes:
      - postgres_order_data:/var/lib/postgresql
      # Volume holding the PostgreSQL data, so it survives container restarts


    ports:
      - "${POSTGRES_PORT}:5432"
      # Publish the internal PostgreSQL port (5432) on the host port (POSTGRES_PORT from
      # order.env), so other services and tools can reach the database

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      # Readiness probe: pg_isready checks whether the database accepts connections.
      # The interval is small because `up --wait` in the up-order task waits on this probe,
      # and with interval=10s the first check happens 10 seconds after start even though
      # postgres is ready in 1-2 seconds.
      interval: 2s        # Check every 2 seconds
      timeout: 3s         # How long to wait for a probe response
      retries: 15         # After 15 consecutive failures the container is "unhealthy"
      start_period: 5s    # Failures during database initialization do not count

    restart: unless-stopped
    # Restart the container automatically after a crash,
    # but not after a manual stop

    networks:
      - microservices-net
      # Join the shared network so other microservices can find this container by name "postgres-order"

  migrator-order: # One-shot goose container: applies the SQL migrations and exits with 0
    build:
      context: ../../..
      dockerfile: deploy/dockerfiles/migrator.Dockerfile
      args:
        # Image and goose versions come from core.env (a single source of truth)
        GO_IMAGE: ${GO_IMAGE}
        ALPINE_IMAGE: ${ALPINE_IMAGE}
        GOOSE_VERSION: ${GOOSE_VERSION}

    depends_on:
      postgres-order:
        condition: service_healthy
        # Do not start the migrations until PostgreSQL passes its healthcheck

    volumes:
      - ../../../migrations/order:/migrations:ro
      # Mount the SQL migrations into the container at /migrations

    command:
      # Inside the docker network the database is reachable at postgres-order:5432 rather
      # than through the host port. Credentials come from POSTGRES_* (order.env).
      - -dir
      - /migrations
      - postgres
      - postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-order:5432/${POSTGRES_DB}?sslmode=disable
      - up

    networks:
      - microservices-net

volumes: # Volumes Docker creates and uses
  postgres_order_data:
  # Named volume with the PostgreSQL data of the Order service,
  # so the database state survives container restarts

networks: # Network settings
  microservices-net:
    external: true
    # We do not create a network but join the existing shared "microservices-net"
    # It is created by task up-core (docker network create microservices-net)
