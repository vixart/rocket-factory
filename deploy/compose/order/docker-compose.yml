services: # Раздел, описывающий контейнеры, которые требуются для работы Order-сервиса

  postgres-order: # Контейнер с PostgreSQL, используемый для хранения данных заказов
    image: ${POSTGRES_IMAGE}
    # Используем официальный образ PostgreSQL на базе Alpine Linux
    # Это лёгкая и быстрая сборка, которая экономит ресурсы

    container_name: postgres-order
    # Устанавливаем уникальное имя контейнера, чтобы было удобно обращаться к нему в CLI и при отладке

    env_file:
      - compose.env
      # POSTGRES_DB/USER/PASSWORD для контейнера БД (см. compose.env рядом)
      # Это позволяет переиспользовать одни и те же переменные в docker-compose, Taskfile и тестах

    volumes:
      - postgres_order_data:/var/lib/postgresql
      # Определяем том, который будет использоваться для хранения данных PostgreSQL
      # Он сохраняет данные между перезапусками контейнера

    ports:
      - "${POSTGRES_PORT}:5432"
      # Пробрасываем внутренний порт PostgreSQL (5432) на порт хоста (POSTGRES_PORT из order.env)
      # Это нужно, чтобы другие сервисы или инструменты могли подключиться к базе

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      # Настраиваем проверку готовности контейнера — pg_isready проверяет, принимает ли база подключения
      interval: 10s  # Интервал между проверками — каждые 10 секунд
      timeout: 5s    # Время ожидания ответа от проверки
      retries: 5     # После 5 неудачных попыток подряд контейнер считается "unhealthy"

    restart: unless-stopped
    # Автоматически перезапускаем контейнер, если он аварийно завершился
    # Если контейнер был остановлен вручную — не перезапускаем

    networks:
      - microservices-net
      # Подключаемся к общей сети, чтобы другие микросервисы могли найти этот контейнер по имени "postgres-order"

  migrator-order: # Одноразовый контейнер goose — накатывает SQL-миграции и завершается (exit 0)
    build:
      context: ../../..
      dockerfile: deploy/dockerfiles/migrator.Dockerfile
      args:
        # Версии образов и goose — из core.env (единый источник истины)
        GO_IMAGE: ${GO_IMAGE}
        ALPINE_IMAGE: ${ALPINE_IMAGE}
        GOOSE_VERSION: ${GOOSE_VERSION}

    depends_on:
      postgres-order:
        condition: service_healthy
        # Не стартуем миграции, пока PostgreSQL не пройдёт healthcheck

    volumes:
      - ../../../migrations/order:/migrations:ro
      # Монтируем SQL-миграции внутрь контейнера в /migrations

    command:
      # Внутри docker-сети база доступна по имени контейнера postgres-order:5432,
      # а не по хостовому порту. Креды берём из POSTGRES_* (интерполяция из order.env).
      - -dir
      - /migrations
      - postgres
      - postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-order:5432/${POSTGRES_DB}?sslmode=disable
      - up

    networks:
      - microservices-net

volumes: # Раздел с томами — определяем, какие дисковые ресурсы создаёт и использует Docker
  postgres_order_data:
  # Именованный том для хранения данных Order-сервиса в PostgreSQL
  # Позволяет сохранять состояние базы даже после перезапуска контейнера

networks: # Сетевые настройки
  microservices-net:
    external: true
    # Мы не создаём новую сеть, а подключаемся к уже существующей общей сети "microservices-net"
    # Эта сеть создаётся через task up-core (docker network create microservices-net)
