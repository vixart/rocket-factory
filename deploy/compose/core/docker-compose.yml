services: # Containers of the shared infrastructure used by every microservice

  kafka: # The Kafka service
    image: ${KAFKA_IMAGE} # Confluent Kafka image, a recent version with KRaft support
    container_name: kafka # Explicit container name, easier to address
    ports:
      - "${KAFKA_EXTERNAL_PORT}:${KAFKA_EXTERNAL_PORT}" # Publish ${KAFKA_EXTERNAL_PORT} so clients on the host machine can connect

    environment: # Environment variables that configure Kafka
      # === Core KRaft settings (Kafka without ZooKeeper) ===
      KAFKA_KRAFT_MODE: "true" # Run in KRaft mode (Kafka Raft Metadata Mode), without ZooKeeper

      KAFKA_PROCESS_ROLES: controller,broker # This process is both controller (metadata) and broker (messages)

      KAFKA_NODE_ID: 1 # Node id, unique within the Kafka cluster

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:${KAFKA_CONTROLLER_PORT}"
      # Members of the Raft controller quorum, in the form "ID@host:port".
      # We have a single node: ID=1, host kafka, port ${KAFKA_CONTROLLER_PORT}.
      # It is required for Kafka metadata consensus.

      # === Listeners ===
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:${KAFKA_INTERNAL_PORT},PLAINTEXT_EXTERNAL://0.0.0.0:${KAFKA_EXTERNAL_PORT},CONTROLLER://kafka:${KAFKA_CONTROLLER_PORT}
      # Which interfaces and ports Kafka listens on.
      # - PLAINTEXT://0.0.0.0:${KAFKA_INTERNAL_PORT} — internal listener for the Docker network.
      # - PLAINTEXT_EXTERNAL://0.0.0.0:${KAFKA_EXTERNAL_PORT} — external listener for the host machine.
      # - CONTROLLER://kafka:${KAFKA_CONTROLLER_PORT} — internal controller-to-broker listener.

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      # Security protocol of each listener. All of them use unencrypted PLAINTEXT here,
      # which is fine for local development.

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Which listener brokers use to talk to each other (one broker here, but it must be set).
      # setting is required). PLAINTEXT is the internal listener on ${KAFKA_INTERNAL_PORT}.

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Which listener carries controller traffic (Raft).

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:${KAFKA_INTERNAL_PORT},PLAINTEXT_EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT},CONTROLLER://kafka:${KAFKA_CONTROLLER_PORT}
      # Important: Kafka advertises the addresses clients should use.
      # - Inside the Docker network it advertises kafka:${KAFKA_INTERNAL_PORT}.
      # - For host connections it advertises localhost:${KAFKA_EXTERNAL_PORT}.
      # - To the controller it advertises kafka:${KAFKA_CONTROLLER_PORT}.

      # === Cluster behaviour ===
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Kafka creates a topic on first producer/consumer access.
      # Topic names come from the service configuration (config.local.yaml).

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Replication factor of the internal offsets topic (one broker, so 1).

      KAFKA_LOG_RETENTION_HOURS: 168
      # Keep topic messages for 168 hours (7 days).

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # No delay before the initial consumer group rebalance (speeds up startup).

      CLUSTER_ID: "Mk3OEYBSD34fcwNTJENDM2Qk"
      # Unique Kafka cluster id.

    volumes:
      - kafka_data:/var/lib/kafka/data
      # Volume holding the Kafka data (logs and messages), so it survives container
      # restarts.

    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "echo > /dev/tcp/localhost/${KAFKA_INTERNAL_PORT}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
      # Check that port ${KAFKA_INTERNAL_PORT} is reachable inside the container.
      # If it is not, Kafka counts as not ready.
      # start_period: 20s — wait 20 seconds before the first check.

    restart: unless-stopped
    # Restart automatically on failure, but not after a manual stop

    networks:
      - microservices-net
      # Join the shared network where all microservices live

  kafka-ui: # Kafka UI web interface for managing the broker and topics
    image: ${KAFKA_UI_IMAGE}
    container_name: kafka-ui
    ports:
      - "${KAFKA_UI_PORT}:8080"
      # Publish the web interface port to the host machine.

    environment:
      KAFKA_CLUSTERS_0_NAME: "local-cluster"
      # Cluster name shown in the UI.

      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:${KAFKA_INTERNAL_PORT}"
      # Broker address inside the container network, used by the UI.

    depends_on:
      kafka:
        condition: service_healthy
      # Make sure Kafka UI starts only once Kafka is healthy.

    healthcheck:
      # wget rather than curl: the kafbat/kafka-ui image ships busybox wget but no curl,
      # so a curl check fails with "executable file not found" and the container stays unhealthy.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
      # Probe the UI through the /actuator/health HTTP endpoint.
      # It counts as healthy only after a successful response.

    restart: unless-stopped
    # Restart automatically on failure, but not after a manual stop

    networks:
      - microservices-net
      # Join the shared network where all microservices live

  # --- Redis for the distributed rate limiter (week 8) ---

  redis-ratelimit:
    image: ${REDIS_RATELIMIT_IMAGE}
    container_name: redis-ratelimit
    ports:
      - "${REDIS_RATELIMIT_PORT}:6379"
      # Publish the Redis port so locally run services (config.local.yaml) can reach the
      # rate limiter at localhost:${REDIS_RATELIMIT_PORT}.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - microservices-net

volumes: # Volume definitions
  kafka_data: # Named volume holding the Kafka data.
  # Docker manages it and the data survives container restarts.

networks:
  microservices-net:
    name: microservices-net
    external: true
    # The network is created by the Taskfile via docker network create
    # Every compose file joins it with external: true
