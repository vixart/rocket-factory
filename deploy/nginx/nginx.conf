# Nginx as the HTTP load balancer in front of several OrderService instances.
#
# How it works:
# 1. Docker Compose starts N replicas of the "order-service" (--scale order-service=3).
# 2. Docker DNS resolves "order-service" to the IP addresses of ALL replicas.
# 3. Nginx spreads requests across them round-robin.
# 4. vegeta (the load test) hits a single Nginx port and Nginx fans out to the instances.
#
# The replica count is NOT configured in Nginx — it is decided at startup:
# docker compose up --scale order-service=3

events {
    worker_connections 1024;
}

http {
    upstream order_backend {
        server order-service:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://order_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
